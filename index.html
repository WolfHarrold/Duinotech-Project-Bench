 click."}, {"t": "Move the snake into its body. Make sure that the LED matrix shows your score."}, {"t": "Push the joystick down into the module to start a new game."}, {"t": "For a harder game, set `WRAP_WALLS` to `false`.", "note": "With `WRAP_WALLS` set to `false`, the edges of the LED matrix are walls."}]}], "faults": [{"fault": "The snake moves in the opposite direction.", "actions": ["Set `INVERT_X` or `INVERT_Y` to `true`."]}, {"fault": "The game becomes too fast.", "actions": ["Increase the value 120 in `stepTime = max(120, …)`."]}], "changes": ["Stop the game temporarily with pushbutton A on D4.", "Add a second type of food that makes the snake shorter."], "code": "// Snake\n// This is the game Snake on the LED matrix. You move the snake to the\n// flashing LED. Each LED makes the snake longer and faster.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   Joystick VRx    ->  A0\n//   Joystick VRy    ->  A1\n//   Joystick SW     ->  D2\n//   Joystick +5V    ->  5V rail\n//   Joystick GND    ->  GND rail\n//   LED matrix DIN  ->  D12\n//   LED matrix CLK  ->  D11\n//   LED matrix CS   ->  D10\n//   LED matrix VCC  ->  5V rail\n//   LED matrix GND  ->  GND rail\n//   Buzzer S        ->  D8\n//   Buzzer +        ->  5V rail\n//   Buzzer -        ->  GND rail\n\n#include <LedControl.h>\n\nconst int BUZZER = 8;\n\n// true: the snake goes off one edge and comes back at the opposite edge\n// false: the edges are walls (harder)\nconst bool WRAP_WALLS = true;\n\n// ---- Joystick: VRx -> A0, VRy -> A1, SW -> D2 ----\nconst int JOY_X = A0;\nconst int JOY_Y = A1;\nconst int JOY_SW = 2;\n\n// If a direction is reversed, change false to true.\nconst bool INVERT_X = false;\nconst bool INVERT_Y = false;\n\nconst byte NONE = 0, UP = 1, DOWN = 2, LEFT = 3, RIGHT = 4;\n\nint joyX() {           // 0 = full left, 1023 = full right\n  int v = analogRead(JOY_X);\n  return INVERT_X ? 1023 - v : v;\n}\n\nint joyY() {           // 0 = full down, 1023 = full up\n  int v = analogRead(JOY_Y);\n  return INVERT_Y ? 1023 - v : v;\n}\n\nbyte joyDirection() {  // which way the stick is pushed, or NONE\n  int dx = joyX() - 512;\n  int dy = joyY() - 512;\n  if (abs(dx) < 300 && abs(dy) < 300) return NONE;\n  if (abs(dx) > abs(dy)) return dx > 0 ? RIGHT : LEFT;\n  return dy > 0 ? UP : DOWN;\n}\n\nbool joyClicked() {    // true while the stick is pressed in\n  return digitalRead(JOY_SW) == LOW;\n}\n// ---- end of joystick section ----\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\n// ---- Tiny 3x5 digits for the matrix ----\n// Each digit is 5 rows; in each row 4 = left dot, 2 = middle dot, 1 = right dot.\nconst byte DIGIT_FONT[10][5] = {\n  {7, 5, 5, 5, 7},  // 0\n  {2, 6, 2, 2, 7},  // 1\n  {7, 1, 7, 4, 7},  // 2\n  {7, 1, 7, 1, 7},  // 3\n  {5, 5, 7, 1, 1},  // 4\n  {7, 4, 7, 1, 7},  // 5\n  {7, 4, 7, 5, 7},  // 6\n  {7, 1, 1, 1, 1},  // 7\n  {7, 5, 7, 5, 7},  // 8\n  {7, 5, 7, 1, 7}   // 9\n};\n\nvoid drawDigit(int digit, int left, int top) {\n  for (int row = 0; row < 5; row++)\n    for (int col = 0; col < 3; col++)\n      if (DIGIT_FONT[digit][row] & (4 >> col)) setPixel(left + col, top + row, true);\n}\n\nvoid drawNumber(int n) {            // shows 0 to 99, centred\n  n = constrain(n, 0, 99);\n  if (n >= 10) {\n    drawDigit(n / 10, 1, 1);\n    drawDigit(n % 10, 5, 1);\n  } else {\n    drawDigit(n, 3, 1);\n  }\n}\n// ---- end of digits section ----\n\n// ---- Start screen: a dot runs round the edge until you click the stick ----\nvoid edgePosition(int i, int &x, int &y) {   // 28 spots around the border\n  i = i % 28;\n  if (i < 7)       { x = i;            y = 0; }\n  else if (i < 14) { x = 7;            y = i - 7; }\n  else if (i < 21) { x = 7 - (i - 14); y = 7; }\n  else             { x = 0;            y = 7 - (i - 21); }\n}\n\nvoid waitForClick() {\n  int i = 0;\n  while (!joyClicked()) {\n    clearFrame();\n    for (int tail = 0; tail < 3; tail++) {\n      int x, y;\n      edgePosition(i + 28 - tail, x, y);\n      setPixel(x, y, true);\n    }\n    showFrame();\n    i = (i + 1) % 28;\n    delay(60);\n  }\n  while (joyClicked()) {}   // wait for release\n  delay(30);\n  randomSeed(micros());     // the moment you clicked makes a good random seed\n}\n// ---- end of start screen section ----\n\nbyte bodyX[64], bodyY[64];   // bodyX[0], bodyY[0] is the head\nint snakeLength;\nbyte heading, nextHeading;\nint foodX, foodY;\nint stepTime;                // milliseconds between moves\nunsigned long lastStep;\n\nbool onSnake(int x, int y, int segments) {\n  for (int i = 0; i < segments; i++) {\n    if (bodyX[i] == x && bodyY[i] == y) return true;\n  }\n  return false;\n}\n\nvoid placeFood() {\n  if (snakeLength >= 64) return;   // no room left\n  do {\n    foodX = random(8);\n    foodY = random(8);\n  } while (onSnake(foodX, foodY, snakeLength));\n}\n\nbool opposite(byte a, byte b) {\n  return (a == UP && b == DOWN) || (a == DOWN && b == UP) ||\n         (a == LEFT && b == RIGHT) || (a == RIGHT && b == LEFT);\n}\n\nvoid newGame() {\n  Serial.println(\"Click the stick to start.\");\n  waitForClick();\n  snakeLength = 3;\n  for (int i = 0; i < 3; i++) {\n    bodyX[i] = 3 - i;\n    bodyY[i] = 4;\n  }\n  heading = nextHeading = RIGHT;\n  stepTime = 350;\n  placeFood();\n  lastStep = millis();\n}\n\n// Moves the snake one square. Returns false if it crashed.\nbool step() {\n  heading = nextHeading;\n  int x = bodyX[0], y = bodyY[0];\n  if (heading == UP) y--;\n  else if (heading == DOWN) y++;\n  else if (heading == LEFT) x--;\n  else x++;\n\n  if (WRAP_WALLS) {\n    x = (x + 8) % 8;\n    y = (y + 8) % 8;\n  } else if (x < 0 || x > 7 || y < 0 || y > 7) {\n    return false;\n  }\n\n  bool eating = (x == foodX && y == foodY);\n  // The tail moves out of the way unless we're growing, so it doesn't count\n  if (onSnake(x, y, eating ? snakeLength : snakeLength - 1)) return false;\n\n  if (eating && snakeLength < 64) snakeLength++;\n  for (int i = snakeLength - 1; i > 0; i--) {\n    bodyX[i] = bodyX[i - 1];\n    bodyY[i] = bodyY[i - 1];\n  }\n  bodyX[0] = x;\n  bodyY[0] = y;\n\n  if (eating) {\n    tone(BUZZER, 1500, 30);\n    stepTime = max(120, stepTime - 15);\n    if (snakeLength >= 64) return false;   // the board is full: you win\n    placeFood();\n  }\n  return true;\n}\n\nvoid draw() {\n  clearFrame();\n  for (int i = 0; i < snakeLength; i++) setPixel(bodyX[i], bodyY[i], true);\n  setPixel(foodX, foodY, (millis() / 150) % 2);   // blinking food\n  showFrame();\n}\n\nvoid gameOver() {\n  int score = snakeLength - 3;\n  Serial.print(\"Game over. Score: \");\n  Serial.println(score);\n  tone(BUZZER, 200, 600);\n  for (int i = 0; i < 3; i++) {\n    clearFrame();\n    showFrame();\n    delay(150);\n    clearFrame();\n    for (int s = 0; s < snakeLength; s++) setPixel(bodyX[s], bodyY[s], true);\n    showFrame();\n    delay(150);\n  }\n  delay(400);\n  clearFrame();\n  drawNumber(score);\n  showFrame();\n  while (!joyClicked()) {}\n  while (joyClicked()) {}\n  delay(30);\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(JOY_SW, INPUT_PULLUP);\n  matrixBegin();\n  newGame();\n}\n\nvoid loop() {\n  byte dir = joyDirection();\n  if (dir != NONE && !opposite(dir, heading)) nextHeading = dir;\n\n  if (millis() - lastStep >= (unsigned long)stepTime) {\n    lastStep = millis();\n    if (!step()) {\n      gameOver();\n      newGame();\n      return;\n    }\n  }\n  draw();\n}\n"}, {"id": "light-seeker", "file": "light_seeker.ino", "no": 22, "title": "Light seeker", "level": 3, "minutes": 30, "parts": ["servo", "ldr", "matrix", "buttons"], "library": "LedControl", "description": "The servo moves the light sensor through a half circle. The LED matrix shows the light values as bars. Then the servo turns to the brightest position.", "learn": ["How to scan and keep values", "How to find the maximum value", "How to scale data into a bar graph"], "wiring": [["servo", "Servo", "orange wire", "D9"], ["servo", "Servo", "red wire", "5V"], ["servo", "Servo", "brown wire", "GND"], ["ldr", "Light sensor", "S", "A2"], ["ldr", "Light sensor", "+", "5V"], ["ldr", "Light sensor", "−", "GND"], ["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"], ["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Do the Light meter project first. Record your `ROOM_LIT` and `ROOM_DARK` values."}, {"t": "Attach the light sensor to the servo horn with tape. Turn the light sensor away from the servo.", "note": "If your jumper cables are too short, use cables with a pin at one end and a socket at the other end."}, {"t": "Push a plastic horn on the servo shaft."}, {"t": "Connect the servo with three jumper cables:", "note": "On some servos, the GND wire is black and the signal wire is yellow.", "rows": [["servo", "Servo", "orange wire", "D9"], ["servo", "Servo", "red wire", "5V"], ["servo", "Servo", "brown wire", "GND"]]}, {"t": "Connect the light sensor:", "rows": [["ldr", "Light sensor", "S", "A2"], ["ldr", "Light sensor", "+", "5V"], ["ldr", "Light sensor", "−", "GND"]]}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Put pushbutton A across the centre gap.", "note": "Diagonally opposite legs of a pushbutton are always the switched pair."}, {"t": "Connect pushbutton A:", "rows": [["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "Change `ROOM_LIT` and `ROOM_DARK` to the values that you recorded in Light meter."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Decrease the light in the room."}, {"t": "Hold a torch on one side of the servo, approximately 50 cm from it."}, {"t": "Make sure that the servo turns slowly from 0° to 180°."}, {"t": "Make sure that the bars on the LED matrix increase in height."}, {"t": "Make sure that the servo turns the light sensor to the torch."}, {"t": "Move the torch. Push pushbutton A to start a new scan."}]}], "faults": [{"fault": "The servo turns to the position with the least light.", "actions": ["Interchange the `ROOM_LIT` and `ROOM_DARK` values."]}, {"fault": "All the bars have the same height.", "actions": ["Decrease the light in the room. Then use a torch."]}], "changes": ["Make the servo move with the light continuously. Examine a small angle on each side and turn to the brighter side.", "Make the buzzer operate when the brightest position moves more than 20°."], "code": "// Light seeker\n// The servo moves the light sensor through a half circle. The LED matrix\n// shows the light values as bars. Then the servo turns to the brightest\n// position.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   Servo orange wire                 ->  D9\n//   Servo red wire                    ->  5V rail\n//   Servo brown wire                  ->  GND rail\n//   Light sensor S                    ->  A2\n//   Light sensor +                    ->  5V rail\n//   Light sensor -                    ->  GND rail\n//   LED matrix DIN                    ->  D12\n//   LED matrix CLK                    ->  D11\n//   LED matrix CS                     ->  D10\n//   LED matrix VCC                    ->  5V rail\n//   LED matrix GND                    ->  GND rail\n//   Button A one leg                  ->  D4\n//   Button A diagonally opposite leg  ->  GND rail\n\n#include <LedControl.h>\n#include <Servo.h>\n\nconst int LDR = A2;\nconst int SERVO_PIN = 9;\nconst int BUTTON = 4;\n\n// Get these two values from the Light meter project.\n// Here, only their order is important. It shows if more light gives a bigger value.\nconst int ROOM_LIT = 700;\nconst int ROOM_DARK = 200;\n\nconst int STEP = 5;                    // degrees between readings\nconst int SAMPLES = 180 / STEP + 1;    // 37 readings from 0 to 180 degrees\nconst unsigned long RESCAN_EVERY = 20000;\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\nServo turret;\nint brightness[SAMPLES];\nunsigned long lastScan = 0;\n\nint readBrightness() {                 // bigger = brighter, whichever way your sensor reads\n  long total = 0;\n  for (int i = 0; i < 4; i++) {\n    total += analogRead(LDR);\n    delay(2);\n  }\n  int reading = total / 4;\n  return (ROOM_LIT > ROOM_DARK) ? reading : 1023 - reading;\n}\n\n// Draws 8 bars, one per 22.5 degree slice, scaled to the readings so far\nvoid drawScan(int count) {\n  int lowest = 1023, highest = 0;\n  for (int i = 0; i < count; i++) {\n    lowest = min(lowest, brightness[i]);\n    highest = max(highest, brightness[i]);\n  }\n  clearFrame();\n  for (int col = 0; col < 8; col++) {\n    int best = -1;\n    for (int i = 0; i < count; i++) {\n      if (i * STEP * 8 / 181 == col) best = max(best, brightness[i]);\n    }\n    if (best < 0) continue;\n    int height = (highest > lowest) ? map(best, lowest, highest, 1, 8) : 1;\n    for (int h = 0; h < height; h++) setPixel(col, 7 - h, true);\n  }\n  showFrame();\n}\n\nvoid scan() {\n  Serial.println(\"Scanning...\");\n  turret.write(0);\n  delay(600);                          // give it time to swing back\n  for (int i = 0; i < SAMPLES; i++) {\n    turret.write(i * STEP);\n    delay(80);\n    brightness[i] = readBrightness();\n    drawScan(i + 1);\n  }\n\n  int brightest = 0;\n  for (int i = 1; i < SAMPLES; i++) {\n    if (brightness[i] > brightness[brightest]) brightest = i;\n  }\n  turret.write(brightest * STEP);\n  Serial.print(\"Brightest at \");\n  Serial.print(brightest * STEP);\n  Serial.println(\" degrees\");\n  lastScan = millis();\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(BUTTON, INPUT_PULLUP);\n  matrixBegin();\n  turret.attach(SERVO_PIN);\n  scan();\n}\n\nvoid loop() {\n  if (digitalRead(BUTTON) == LOW || millis() - lastScan > RESCAN_EVERY) {\n    scan();\n  }\n}\n"}, {"id": "quick-draw", "file": "quick_draw.ino", "no": 23, "title": "Quick draw", "level": 3, "minutes": 20, "parts": ["buttons", "rgb", "matrix", "buzzer"], "library": "LedControl", "description": "This is a game for two players. When the LED matrix comes on, push your pushbutton first. A push before that gives the point to the other player.", "learn": ["How to read two inputs fairly", "How to keep a score", "Penalties for a `false` start"], "wiring": [["buttons", "Player 1 button", "one leg", "D4"], ["buttons", "Player 1 button", "diagonally opposite leg", "GND"], ["buttons", "Player 2 button", "one leg", "A3"], ["buttons", "Player 2 button", "diagonally opposite leg", "GND"], ["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"], ["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Put the player 1 pushbutton across the centre gap at the left end of the breadboard.", "note": "Diagonally opposite legs of a pushbutton are always the switched pair."}, {"t": "Connect the player 1 pushbutton:", "rows": [["buttons", "Player 1 button", "one leg", "D4"], ["buttons", "Player 1 button", "diagonally opposite leg", "GND"]]}, {"t": "Put the player 2 pushbutton across the centre gap at the right end of the breadboard."}, {"t": "Connect the player 2 pushbutton:", "rows": [["buttons", "Player 2 button", "one leg", "A3"], ["buttons", "Player 2 button", "diagonally opposite leg", "GND"]]}, {"t": "Connect the RGB LED:", "rows": [["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]]}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that the LED matrix shows 0 0. This is the score."}, {"t": "Push a pushbutton to start a round."}, {"t": "When a small square shows, do not push."}, {"t": "When all the LEDs on the LED matrix come on, push your pushbutton."}, {"t": "Make sure that an arrow points to the winner and the RGB LED shows the winner colour."}, {"t": "Push a pushbutton during the small square. Make sure that the other player gets the point."}]}], "faults": [{"fault": "One player gets each point immediately.", "actions": ["Make sure that the two connections of that pushbutton are on diagonally opposite legs."]}], "changes": ["Show 3, 2, 1 on the LED matrix before each round.", "Show the reaction time of each winner in the Serial Monitor."], "code": "// Quick draw\n// This is a game for two players. When the LED matrix comes on, push your\n// pushbutton first. A push before that gives the point to the other player.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   Player 1 button one leg                  ->  D4\n//   Player 1 button diagonally opposite leg  ->  GND rail\n//   Player 2 button one leg                  ->  A3\n//   Player 2 button diagonally opposite leg  ->  GND rail\n//   RGB LED R                                ->  D5\n//   RGB LED G                                ->  D6\n//   RGB LED B                                ->  D3\n//   RGB LED -                                ->  GND rail\n//   LED matrix DIN                           ->  D12\n//   LED matrix CLK                           ->  D11\n//   LED matrix CS                            ->  D10\n//   LED matrix VCC                           ->  5V rail\n//   LED matrix GND                           ->  GND rail\n//   Buzzer S                                 ->  D8\n//   Buzzer +                                 ->  5V rail\n//   Buzzer -                                 ->  GND rail\n\n#include <LedControl.h>\n\nconst int BUTTON_P1 = 4;\nconst int BUTTON_P2 = A3;\nconst int BUZZER = 8;\nconst int WINS_NEEDED = 5;\n\nconst byte UP = 1, DOWN = 2, LEFT = 3, RIGHT = 4;   // used by drawArrow()\n\n// ---- RGB LED module: R -> D5, G -> D6, B -> D3, - -> GND rail ----\nconst int RGB_RED = 5;\nconst int RGB_GREEN = 6;\nconst int RGB_BLUE = 3;\n\n// If the RGB LED shows white when it must be off, it is common anode.\n// Connect its common pin to the 5V rail and set this to true.\nconst bool COMMON_ANODE = false;\n\nvoid setColor(int red, int green, int blue) {   // each 0 (off) to 255 (full)\n  if (COMMON_ANODE) { red = 255 - red; green = 255 - green; blue = 255 - blue; }\n  analogWrite(RGB_RED, red);\n  analogWrite(RGB_GREEN, green);\n  analogWrite(RGB_BLUE, blue);\n}\n\nvoid rgbBegin() {\n  pinMode(RGB_RED, OUTPUT);\n  pinMode(RGB_GREEN, OUTPUT);\n  pinMode(RGB_BLUE, OUTPUT);\n  setColor(0, 0, 0);\n}\n// ---- end of RGB LED section ----\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\n// ---- Arrows for the matrix ----\nconst byte ARROW_UP[8] = {\n  0b00011000,\n  0b00111100,\n  0b01111110,\n  0b11011011,\n  0b00011000,\n  0b00011000,\n  0b00011000,\n  0b00011000\n};\n\nvoid drawArrow(byte dir) {     // dir is UP, DOWN, LEFT or RIGHT\n  clearFrame();\n  for (int y = 0; y < 8; y++) {\n    for (int x = 0; x < 8; x++) {\n      if (!(ARROW_UP[y] & (0x80 >> x))) continue;\n      if (dir == UP) setPixel(x, y, true);\n      else if (dir == DOWN) setPixel(x, 7 - y, true);\n      else if (dir == LEFT) setPixel(y, x, true);\n      else setPixel(7 - y, x, true);\n    }\n  }\n  showFrame();\n}\n// ---- end of arrows section ----\n\n// ---- Tiny 3x5 digits for the matrix ----\n// Each digit is 5 rows; in each row 4 = left dot, 2 = middle dot, 1 = right dot.\nconst byte DIGIT_FONT[10][5] = {\n  {7, 5, 5, 5, 7},  // 0\n  {2, 6, 2, 2, 7},  // 1\n  {7, 1, 7, 4, 7},  // 2\n  {7, 1, 7, 1, 7},  // 3\n  {5, 5, 7, 1, 1},  // 4\n  {7, 4, 7, 1, 7},  // 5\n  {7, 4, 7, 5, 7},  // 6\n  {7, 1, 1, 1, 1},  // 7\n  {7, 5, 7, 5, 7},  // 8\n  {7, 5, 7, 1, 7}   // 9\n};\n\nvoid drawDigit(int digit, int left, int top) {\n  for (int row = 0; row < 5; row++)\n    for (int col = 0; col < 3; col++)\n      if (DIGIT_FONT[digit][row] & (4 >> col)) setPixel(left + col, top + row, true);\n}\n\nvoid drawNumber(int n) {            // shows 0 to 99, centred\n  n = constrain(n, 0, 99);\n  if (n >= 10) {\n    drawDigit(n / 10, 1, 1);\n    drawDigit(n % 10, 5, 1);\n  } else {\n    drawDigit(n, 3, 1);\n  }\n}\n// ---- end of digits section ----\n\nint score1 = 0, score2 = 0;\nbool seeded = false;\n\nbool p1Down() { return digitalRead(BUTTON_P1) == LOW; }\nbool p2Down() { return digitalRead(BUTTON_P2) == LOW; }\n\nvoid showScores() {\n  clearFrame();\n  drawDigit(score1, 1, 1);    // player 1 on the left\n  drawDigit(score2, 5, 1);    // player 2 on the right\n  showFrame();\n}\n\nvoid pointTo(int player, bool falseStart) {\n  if (player == 1) score1++;\n  else score2++;\n\n  drawArrow(player == 1 ? LEFT : RIGHT);\n  if (player == 1) setColor(255, 0, 0);    // player 1 is red\n  else setColor(0, 0, 255);                // player 2 is blue\n\n  if (falseStart) {\n    tone(BUZZER, 150, 500);\n  } else {\n    tone(BUZZER, 1047, 90); delay(110);\n    tone(BUZZER, 1568, 150);\n  }\n  Serial.print(falseStart ? \"False start! Point to player \" : \"Point to player \");\n  Serial.println(player);\n  delay(1500);\n  setColor(0, 0, 0);\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(BUTTON_P1, INPUT_PULLUP);\n  pinMode(BUTTON_P2, INPUT_PULLUP);\n  rgbBegin();\n  matrixBegin();\n}\n\nvoid loop() {\n  showScores();\n  Serial.println(\"Both players: press your button when you're ready.\");\n  while (!(p1Down() || p2Down())) {}\n  if (!seeded) {\n    randomSeed(micros());\n    seeded = true;\n  }\n  while (p1Down() || p2Down()) {}           // wait for both to let go\n  delay(300);\n\n  // Ready: a small square in the middle, amber light\n  clearFrame();\n  for (int x = 3; x <= 4; x++)\n    for (int y = 3; y <= 4; y++) setPixel(x, y, true);\n  showFrame();\n  setColor(255, 90, 0);\n\n  unsigned long waitTime = random(2000, 6000);\n  unsigned long start = millis();\n  while (millis() - start < waitTime) {\n    if (p1Down()) { pointTo(2, true); return; }\n    if (p2Down()) { pointTo(1, true); return; }\n  }\n\n  // GO: whole matrix on, white light, beep\n  for (int y = 0; y < 8; y++) frame[y] = 0xFF;\n  showFrame();\n  setColor(255, 255, 255);\n  tone(BUZZER, 1800, 100);\n\n  while (true) {\n    bool one = p1Down();\n    bool two = p2Down();\n    if (one && two) {                        // exactly the same moment: nobody scores\n      Serial.println(\"Dead heat!\");\n      setColor(0, 0, 0);\n      delay(1000);\n      break;\n    }\n    if (one) { pointTo(1, false); break; }\n    if (two) { pointTo(2, false); break; }\n  }\n  while (p1Down() || p2Down()) {}\n\n  if (score1 >= WINS_NEEDED || score2 >= WINS_NEEDED) {\n    int winner = score1 >= WINS_NEEDED ? 1 : 2;\n    Serial.print(\"Player \");\n    Serial.print(winner);\n    Serial.println(\" wins the match!\");\n    showScores();\n    for (int i = 0; i < 6; i++) {\n      if (winner == 1) setColor(255, 0, 0);\n      else setColor(0, 0, 255);\n      tone(BUZZER, 784 + i * 100, 120);\n      delay(200);\n      setColor(0, 0, 0);\n      delay(150);\n    }\n    delay(1500);\n    score1 = 0;\n    score2 = 0;\n  }\n}\n"}], "parts": [{"key": "uno", "name": "UNO main board", "module": null, "what": "The UNO board is the controller. It keeps one sketch in its memory and does the sketch when it has power.", "pins": ["D0–D13 digital", "A0–A5 analog in", "~ marks PWM pins", "5V", "3.3V", "GND"], "tips": ["Pins with the ~ mark (3, 5, 6, 9, 10, 11) can change brightness with `analogWrite()`.", "A0 to A5 measure a voltage as a value from 0 to 1023. They also operate as digital pins.", "D0 and D1 carry the USB data. Keep them free.", "The L LED on the UNO board connects to D13.", "The USB socket supplies approximately 500 mA for the board and all the parts."]}, {"key": "breadboard", "name": "Breadboard", "module": null, "what": "The breadboard connects parts without solder. You push the legs and the jumper cables into its holes.", "pins": ["rows of 5 joined holes", "centre gap", "+ and − rails"], "tips": ["Each short row of five holes is connected below the surface. The centre gap isolates the two sides.", "The long red (+) and blue (−) rails go along the full breadboard. In this guide, they are the 5V rail and the GND rail.", "On some breadboards, each rail has two halves. If the far half has no power, connect the halves with a jumper cable."]}, {"key": "leds", "name": "LEDs", "module": "leds", "what": "An LED gives light when current goes through it in the correct direction. Each LED needs a resistor.", "pins": ["long leg +", "short leg −"], "tips": ["The long leg is the positive (+) leg. Connect it to the pin through the resistor.", "The short leg is the negative (−) leg. The rim of the LED is flat on this side.", "Use a 220 Ω or 330 Ω resistor. Without a resistor, the current can cause damage to the LED and the pin."]}, {"key": "resistors", "name": "Resistors", "module": null, "what": "A resistor limits the current. The colour bands show its value.", "pins": ["no polarity"], "tips": ["220 Ω: red, red, brown (4 bands) or red, red, black, black (5 bands). Use it for LEDs.", "330 Ω: orange, orange, brown. You can also use it for LEDs.", "1 kΩ: brown, black, red. 10 kΩ: brown, black, orange.", "Read the bands from the end that is farther from the gold or brown tolerance band."]}, {"key": "buttons", "name": "Pushbuttons", "module": "buttons", "what": "A pushbutton connects two legs while you push it. It has four legs in two connected pairs.", "pins": ["4 legs", "diagonal legs = switched"], "tips": ["Put the pushbutton across the centre gap. Diagonally opposite legs are always the switched pair.", "Connect one leg to the pin and the diagonally opposite leg to the GND rail.", "The sketches use `INPUT_PULLUP`. The pin reads `LOW` when you push the pushbutton. No resistor is necessary."]}, {"key": "jumpers", "name": "Jumper leads", "module": null, "what": "Jumper cables connect the UNO board pins to the breadboard holes.", "pins": [], "tips": ["Use red jumper cables for 5V and black jumper cables for GND. Then you can see errors easily."]}, {"key": "servo", "name": "Servo motor", "module": "servo", "what": "The servo has a motor, gears and a position sensor. It turns its arm to an angle from 0° to 180° and holds it there.", "pins": ["brown GND", "red 5V", "orange signal"], "tips": ["The Servo library is in the Arduino IDE. No installation is necessary.", "While the Servo library operates, D9 and D10 cannot change brightness. For this reason, the RGB LED uses D3, D5 and D6.", "Do not turn the servo arm with your hand while the power is on. This can cause damage to the plastic gears.", "The servo can briefly use more current than the USB socket supplies. If the UNO board resets, use a USB hub with a separate power supply."]}, {"key": "ldr", "name": "Light sensor (LDR)", "module": "ldr", "what": "The light sensor has a light-dependent resistor (LDR). Its resistance changes with the light. The UNO board reads this as a value.", "pins": ["S signal", "+", "−"], "tips": ["`analogRead(A2)` gives a value from 0 to 1023.", "On some light sensors, the value increases with more light. On other light sensors, it decreases. Do the Light meter project to find your type.", "The sketches use `ROOM_LIT` and `ROOM_DARK`. For this reason, they operate with the two types."]}, {"key": "rgb", "name": "RGB LED module", "module": "rgb", "what": "The RGB LED has a red, a green and a blue LED in one package. Together, they make many colours.", "pins": ["R", "G", "B", "− common"], "tips": ["`analogWrite()` with a value from 0 to 255 sets the brightness of each colour.", "If all colours come on when the sketch sets them to off, the RGB LED is common anode. Connect its common pin to the 5V rail and set `COMMON_ANODE` to `true`.", "While `tone()` makes a sound, D3 cannot change brightness. Thus, the game sketches set blue only to fully on or fully off."]}, {"key": "joystick", "name": "Joystick", "module": "joystick", "what": "The joystick has two potentiometers, one for each direction, and a switch below the knob.", "pins": ["GND", "+5V", "VRx", "VRy", "SW"], "tips": ["At the centre, each direction gives a value of approximately 512. The full range is 0 to 1023.", "The switch uses `INPUT_PULLUP`. The SW pin reads `LOW` when you push the joystick down.", "The directions depend on how you hold the joystick. The sketches have `INVERT_X` and `INVERT_Y` settings to correct them."]}, {"key": "buzzer", "name": "Buzzer", "module": "buzzer", "what": "The buzzer makes sounds. It is probably the active type that Jaycar also sells as XC4424.", "pins": ["S signal", "+", "−"], "tips": ["An active buzzer makes one fixed sound when its pin is `HIGH`. With `tone()`, it makes a rough sound.", "A passive buzzer makes no sound with a `HIGH` pin. With `tone()`, it plays clear notes.", "Do the Buzzer check project to find your type. All the sketches use `tone()`, which operates with the two types."]}, {"key": "matrix", "name": "LED matrix", "module": "matrix", "what": "The LED matrix has 64 red LEDs in 8 rows and 8 columns. Its driver chip keeps the picture, so it needs only three signal pins.", "pins": ["VCC", "GND", "DIN", "CS", "CLK"], "tips": ["The kit guide uses a MAX7219 driver chip. The sketches use the LedControl library by Eberhard Fahle.", "The sketches set the brightness to 3 of 15. All 64 LEDs at full brightness use much current.", "Do the Matrix hello project first. It finds the correct orientation settings.", "Some matrices have only four pins: VCC, GND, SDA and SCL. This is the HT16K33 type, which uses A4 and A5. The sketches need a different matrix section for it. Ask Claude to change one."]}, {"key": "line", "name": "Line tracer", "module": "line", "what": "The line tracer has an infrared LED and a light sensor. The light sensor measures the infrared light that comes back from the surface below.", "pins": ["OUT", "VCC", "GND"], "tips": ["The maximum range is approximately 20 mm.", "It gives a `HIGH` or `LOW` signal. The value for white depends on the line tracer. Do the Line sensor test project to find it.", "If it has a blue trimpot, turn the trimpot to change the range.", "Sunlight has much infrared light. It can stop the line tracer from operating correctly."]}], "homePins": [["D13", "leds", "Red LED (also the board's L light)"], ["D12", "matrix", "LED matrix DIN"], ["D11", "matrix", "LED matrix CLK"], ["D10", "matrix", "LED matrix CS"], ["D9", "servo", "Servo signal (orange)"], ["D8", "buzzer", "Buzzer S"], ["D7", "line", "Line tracer OUT"], ["D6", "rgb", "RGB LED G"], ["D5", "rgb", "RGB LED R"], ["D4", "buttons", "Button A / player 1"], ["D3", "rgb", "RGB LED B"], ["D2", "joystick", "Joystick SW (click)"], ["A0", "joystick", "Joystick VRx"], ["A1", "joystick", "Joystick VRy"], ["A2", "ldr", "Light sensor S"], ["A3", "buttons", "Button B / player 2"], ["A4", "leds", "Yellow LED"], ["A5", "leds", "Green LED"]], "setup": [{"title": "Install the Arduino IDE", "steps": [{"t": "Open arduino.cc/en/software in a web browser on the computer."}, {"t": "Download the Arduino IDE for your computer (Windows, macOS or Linux)."}, {"t": "Install the Arduino IDE."}]}, {"title": "Connect the UNO board", "steps": [{"t": "Connect the UNO board to the computer with the USB cable from the kit."}, {"t": "Make sure that the green ON LED on the UNO board comes on.", "note": "The installation of the drivers can continue for approximately one minute."}]}, {"title": "Set the board and the port", "steps": [{"t": "In the Arduino IDE, set ⟦Tools › Board⟧ to ⟦Arduino AVR Boards › Arduino Uno⟧.", "note": "The Duinotech UNO board operates as an Arduino Uno."}, {"t": "Set ⟦Tools › Port⟧ to the port of the UNO board.", "note": "If two or more ports show, disconnect the USB cable. The port that goes away is the UNO board."}]}, {"title": "Upload the first sketch", "steps": [{"t": "Open the First upload project."}, {"t": "Do the steps in the project."}, {"t": "Make sure that the L LED on the UNO board flashes."}]}, {"title": "Install the LedControl library", "steps": [{"t": "In the Arduino IDE, open ⟦Sketch › Include Library › Manage Libraries⟧."}, {"t": "Enter LedControl in the search box."}, {"t": "Find LedControl by Eberhard Fahle and click ⟦Install⟧.", "note": "The LED matrix projects use this library. The Servo library is already in the Arduino IDE."}]}, {"title": "Prepare the breadboard rails", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the red (+) rail with a red jumper cable. This is the 5V rail."}, {"t": "Connect a GND pin of the UNO board to the blue (−) rail with a black jumper cable. This is the GND rail."}, {"t": "If the rails have a gap at the middle of the breadboard, connect the two halves with jumper cables.", "note": "On some breadboards, the rails have two halves that are not connected."}]}, {"title": "Find the Serial Monitor and the Serial Plotter", "steps": [{"t": "Open the Tools menu in the Arduino IDE."}, {"t": "Find Serial Monitor and Serial Plotter.", "note": "The Serial Monitor shows text. The Serial Plotter shows numbers as a live graph."}, {"t": "Set the speed to 9600 baud. All the sketches on this page use this speed."}]}], "rules": ["Disconnect the USB cable before you change the wiring.", "Do not connect the 5V rail directly to the GND rail.", "Put a 220 Ω or 330 Ω resistor in series with each LED.", "Use red jumper cables for 5V and black jumper cables for GND.", "Make one change at a time when you look for a fault."], "setupFaults": [{"fault": "No port shows in ⟦Tools › Port⟧.", "actions": ["Use a different USB cable. Some cables can only charge a phone.", "Look at the small chip near the USB socket of the UNO board. If it has the label CH340, install the CH340 driver for your computer."]}, {"fault": "The upload stops with “not in sync”.", "actions": ["Make sure that the board and the port are correct.", "Disconnect all jumper cables from D0 and D1."]}, {"fault": "The upload stops with “No such file or directory” for a .h file.", "actions": ["Install the applicable library. Refer to task 5."]}, {"fault": "The UNO board resets again and again.", "actions": ["Disconnect the servo. It can use more current than the USB socket supplies.", "Refer to Pin map, “Power”."]}], "pinNotes": ["The RGB LED uses three PWM (~) pins: D3, D5 and D6. The Servo library uses the timer of D9 and D10.", "The joystick and the light sensor give a range of values. They use the analog pins A0 to A2.", "A3, A4 and A5 also operate as digital pins. A pushbutton and two LEDs use them.", "D0 and D1 carry the USB data. Keep them free."], "powerNotes": ["The USB socket supplies approximately 500 mA for all the parts.", "The LED matrix and the servo use the most current.", "The sketches set the matrix brightness to 3 of 15. Increase it only when some of the parts are disconnected."], "powerCaution": "If the UNO board resets when the servo moves, disconnect the red servo wire. Connect it again only for servo projects."}</script>
<script>
(function () {
  "use strict";
  var KIT = JSON.parse(document.getElementById("kit-data").textContent);
  var view = document.getElementById("view");
  var LEVELS = { 1: "Starter", 2: "Builder", 3: "Challenge" };
  var LEVEL_NOTES = {
    1: "One part at a time. Each project shows what one part does.",
    2: "Two to five parts that operate together.",
    3: "Full games and devices that use most of the kit."
  };
  var MOD_ORDER = ["leds", "buttons", "ldr", "joystick", "rgb", "buzzer", "servo", "matrix", "line"];
  var BUILT_KEY = "xc3900-built-v1";
  var STEPS_KEY = "xc3900-steps-v1";

  var state = { level: 0, parts: [], listScroll: 0 };
  var built = load(BUILT_KEY, []);
  var ticks = load(STEPS_KEY, {});
  if (!Array.isArray(built)) built = [];
  if (!ticks || typeof ticks !== "object" || Array.isArray(ticks)) ticks = {};

  function load(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable: keep in memory */ }
  }
  function isBuilt(id) { return built.indexOf(id) !== -1; }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  }
  // `code` spans, ⟦UI labels⟧, and pin names get their own styles
  function fmt(s) {
    if (s == null) return "";
    return String(s).split("`").map(function (part, i) {
      if (i % 2 === 1) return "<code>" + esc(part) + "</code>";
      return esc(part)
        .replace(/⟦([^⟧]+)⟧/g, '<span class="ui">$1</span>')
        .replace(/\b(D1[0-3]|D[2-9]|A[0-5])\b/g, '<span class="pinref">$1</span>');
    }).join("");
  }
  function modVar(k) { return "var(--m-" + k + ")"; }
  function brightVar(pin, k) { return pin === "5V" ? "var(--b-5v)" : pin === "GND" ? "var(--b-gnd)" : "var(--b-" + k + ")"; }
  function pips(level) {
    var h = '<span class="pips" aria-hidden="true">';
    for (var i = 1; i <= 3; i++) h += '<i class="' + (i <= level ? "on" : "") + '"></i>';
    return h + "</span>";
  }
  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function each(sel, fn) { Array.prototype.forEach.call(view.querySelectorAll(sel), fn); }

  /* ---------- PCB pin strip ---------- */
  var DIGITAL = ["D13", "D12", "D11", "D10", "D9", "D8", "D7", "D6", "D5", "D4", "D3", "D2", "D1", "D0"];
  var PWM = { D3: 1, D5: 1, D6: 1, D9: 1, D10: 1, D11: 1 };
  var ANALOG = ["A0", "A1", "A2", "A3", "A4", "A5"];
  function pinStrip(used, legendItems, standalone) {
    function cell(pin, label) {
      var key = used[pin], isUsed = !!key, dead = pin === "D0" || pin === "D1";
      var style = isUsed ? ' style="--pc:' + brightVar(pin, key) + '"' : "";
      var tag = isUsed ? (pin === "5V" ? "5V" : pin === "GND" ? "GND" : KIT.modules[key].short) : "";
      var title = dead ? pin + ": USB data, keep free" : isUsed ? pin + ": " + (pin === "5V" || pin === "GND" ? pin + " rail" : KIT.modules[key].name) : pin + ": not used";
      return '<div class="pin' + (isUsed ? " used" : "") + (dead ? " dead" : "") + '"' + style + ' title="' + esc(title) + '"><span class="pad"></span><span class="silk">' + esc(label) + '</span><span class="tagv">' + esc(tag) + "</span></div>";
    }
    var d = DIGITAL.map(function (p) {
      var label = (PWM[p] ? "~" : "") + p.slice(1);
      if (p === "D1") label = "TX"; if (p === "D0") label = "RX";
      return cell(p, label);
    }).join("");
    var legend = legendItems && legendItems.length ? '<div class="board-legend">' + legendItems.map(function (it) { return '<span style="--pc:' + it.color + '"><i></i>' + esc(it.label) + "</span>"; }).join("") + "</div>" : "";
    return '<div class="board' + (standalone ? " standalone" : "") + '" role="img" aria-label="UNO board pin headers. The pins in use are lit.">' +
      '<div class="hdr"><span class="hdr-label">Digital · ~ = PWM</span><div class="pins d">' + d + "</div></div>" +
      '<div class="hdr-row2"><div class="hdr"><span class="hdr-label">Power</span><div class="pins p">' + cell("5V", "5V") + cell("GND", "GND") + "</div></div>" +
      '<div class="hdr"><span class="hdr-label">Analog in</span><div class="pins a">' + ANALOG.map(function (p) { return cell(p, p); }).join("") + "</div></div></div>" + legend + "</div>";
  }
  function legendFor(mods, rows) {
    var items = mods.map(function (k) { return { color: "var(--b-" + k + ")", label: KIT.modules[k].name }; });
    if (rows.some(function (r) { return r[3] === "5V"; })) items.push({ color: "var(--b-5v)", label: "5V rail" });
    if (rows.some(function (r) { return r[3] === "GND"; })) items.push({ color: "var(--b-gnd)", label: "GND rail" });
    return items;
  }

  /* ---------- code highlighting ---------- */
  function setOf(a) { var o = {}; a.forEach(function (k) { o[k] = 1; }); return o; }
  var KWS = setOf(["void", "int", "bool", "byte", "const", "if", "else", "for", "while", "do", "return", "true", "false", "long", "unsigned", "float", "char", "switch", "case", "default", "break", "continue", "static", "Servo", "LedControl", "Serial"]);
  var FNS = setOf(["setup", "loop", "pinMode", "digitalWrite", "digitalRead", "analogRead", "analogWrite", "delay", "millis", "micros", "tone", "noTone", "random", "randomSeed", "map", "constrain", "abs", "min", "max", "sqrt", "atan2", "pgm_read_byte", "strlen", "strcpy", "begin", "print", "println", "available", "readBytesUntil", "setTimeout", "attach", "write", "setRow", "shutdown", "setIntensity", "clearDisplay"]);
  var CS = setOf(["HIGH", "LOW", "INPUT", "OUTPUT", "INPUT_PULLUP", "LED_BUILTIN", "PI", "PROGMEM", "A0", "A1", "A2", "A3", "A4", "A5"]);
  var TOKEN = /(\/\/[^\n]*)|("(?:\\.|[^"\\\n])*")|('(?:\\.|[^'\\\n])')|(^[ \t]*#\w+[^\n]*)|(\b0b[01]+\b|\b0x[0-9A-Fa-f]+\b|\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/gm;
  function highlight(src) {
    var out = "", last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src)) !== null) {
      out += esc(src.slice(last, m.index));
      var t = m[0], cls = "";
      if (m[1]) cls = "t-com"; else if (m[2] || m[3]) cls = "t-str"; else if (m[4]) cls = "t-pre"; else if (m[5]) cls = "t-num";
      else if (m[6]) cls = KWS[t] ? "t-kw" : FNS[t] ? "t-fn" : (CS[t] || /^[A-Z][A-Z0-9_]{2,}$/.test(t)) ? "t-const" : "";
      out += cls ? '<span class="' + cls + '">' + esc(t) + "</span>" : esc(t);
      last = TOKEN.lastIndex;
    }
    out += esc(src.slice(last));
    return out.split("\n").map(function (line) { return '<span class="ln">' + (line || " ") + "</span>"; }).join("");
  }

  /* ---------- shared renderers ---------- */
  function setTab(name) {
    document.querySelectorAll(".tab").forEach(function (a) {
      if (a.getAttribute("data-tab") === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }
  function pinRows(rows) {
    var labels = {};
    rows.forEach(function (r) { labels[r[1]] = 1; });
    var mixed = Object.keys(labels).length > 1;
    return '<div class="pinrows">' + rows.map(function (r) {
      var dest = r[3], cls = "dest", text = dest;
      if (dest === "5V") { cls += " rail-5v"; text = "5V rail"; } else if (dest === "GND") { cls += " rail-gnd"; text = "GND rail"; }
      return '<div class="pinrow" style="--mc:' + modVar(r[0]) + '"><span class="from">' + esc(mixed ? r[1] + " · " + r[2] : r[2]) + '</span><span class="arrow" aria-hidden="true">→</span><span class="' + cls + '">' + esc(text) + "</span></div>";
    }).join("") + "</div>";
  }
  function stepHTML(s, num, key, done) {
    var pre = "";
    if (s.warning) pre += '<div class="warning" role="note"><b>Warning</b>' + fmt(s.warning) + "</div>";
    if (s.caution) pre += '<div class="caution" role="note"><b>Caution</b>' + fmt(s.caution) + "</div>";
    var body = '<p class="rich">' + fmt(s.t) + "</p>" + (s.rows ? pinRows(s.rows) : "") + (s.note ? '<div class="note rich"><b>Note</b>' + fmt(s.note) + "</div>" : "");
    var btn = key
      ? '<button class="step-no" type="button" data-step="' + key + '" aria-pressed="' + done + '" aria-label="Step ' + num + (done ? ", done" : ", mark as done") + '">' + (done ? "✓" : num) + "</button>"
      : '<span class="step-no" aria-hidden="true">' + num + "</span>";
    return '<li class="step' + (done ? " done" : "") + '">' + pre + '<div class="step-row">' + btn + '<div class="step-body">' + body + "</div></div></li>";
  }
  function taskHTML(task, ti, id, done) {
    return '<section class="sec" id="task-' + (ti + 1) + '"><div class="task-head"><span class="task-no">' + (ti + 1) + '</span><div><span class="task-sub">Task ' + (ti + 1) + "</span><h2>" + esc(task.title) + "</h2></div></div>" +
      '<ol class="steps">' + task.steps.map(function (s, si) {
        var key = id ? ti + "." + si : null;
        return stepHTML(s, si + 1, key, key ? done.indexOf(key) !== -1 : false);
      }).join("") + "</ol></section>";
  }
  function faultsHTML(faults) {
    return '<div class="faults">' + faults.map(function (f) {
      return '<div class="fault"><div class="fault-q rich"><span>Fault</span><div>' + fmt(f.fault) + '</div></div><ol class="rich">' + f.actions.map(function (a) { return "<li>" + fmt(a) + "</li>"; }).join("") + "</ol></div>";
    }).join("") + "</div>";
  }

  /* ---------- projects index ---------- */
  function filtered() {
    return KIT.projects.filter(function (p) {
      if (state.level && p.level !== state.level) return false;
      return state.parts.every(function (k) { return p.parts.indexOf(k) !== -1; });
    });
  }
  function cardHTML(p) {
    var partsHtml = p.parts.length ? p.parts.map(function (k) { return '<span style="--mc:' + modVar(k) + '"><i class="dot"></i>' + esc(KIT.modules[k].name) + "</span>"; }).join("") : "<span>Only the UNO board</span>";
    return '<a class="card" href="#p-' + p.id + '"><div class="card-top"><span class="card-no">' + pad2(p.no) + '</span><span class="card-meta"><span class="level">' + pips(p.level) + LEVELS[p.level] + "</span>" +
      (isBuilt(p.id) ? '<span class="badge-built">Built</span>' : "<span>" + p.minutes + " min</span>") + "</span></div>" +
      "<h3>" + esc(p.title) + '</h3><p class="rich">' + fmt(p.description) + '</p><div class="card-parts">' + partsHtml + "</div></a>";
  }
  function renderProjects() {
    setTab("projects");
    var total = KIT.projects.length, done = KIT.projects.filter(function (p) { return isBuilt(p.id); }).length, list = filtered();
    var levelChips = [0, 1, 2, 3].map(function (l) { return '<button class="chip" type="button" data-level="' + l + '" aria-pressed="' + (state.level === l) + '">' + (l ? pips(l) + LEVELS[l] : "All levels") + "</button>"; }).join("");
    var partChips = MOD_ORDER.map(function (k) { return '<button class="chip" type="button" data-part="' + k + '" aria-pressed="' + (state.parts.indexOf(k) !== -1) + '" style="--mc:' + modVar(k) + '"><i class="dot"></i>' + esc(KIT.modules[k].name) + "</button>"; }).join("");
    var clear = (state.level || state.parts.length) ? '<button class="chip clear" type="button" data-clear="1">Clear filters</button>' : "";
    var groups = "";
    [1, 2, 3].forEach(function (l) {
      var items = list.filter(function (p) { return p.level === l; });
      if (!items.length) return;
      groups += '<section class="group"><div class="group-head"><h2>' + LEVELS[l] + "</h2><p>" + LEVEL_NOTES[l] + '</p></div><div class="grid">' + items.map(cardHTML).join("") + "</div></section>";
    });
    if (!groups) groups = '<div class="empty">No project uses all of these parts together. Remove a part from the filter.</div>';
    view.innerHTML = '<div class="wrap"><div class="hero-index"><div><p class="kicker">Duinotech UNO Learning Kit · Jaycar XC3900</p>' +
      "<h1><em>" + total + "</em> builds from one box</h1>" +
      '<p class="lede">Each project uses only the parts in the kit. Each one has numbered steps, wiring and code for the UNO board. All projects use the same <a href="#pins">home pins</a>. Thus, the parts can stay connected while you change sketches.</p></div>' +
      '<div class="progress"><div class="progress-top"><span class="progress-num">' + done + " <small>/ " + total + '</small></span><span class="progress-label">Built</span></div><div class="bar"><i style="width:' + Math.round(done / total * 100) + '%"></i></div><p>Open a project and tap “Mark as built”. This browser keeps your progress.</p></div></div>' +
      '<div class="filters"><div class="filter-row"><span class="filter-label">Level</span>' + levelChips + '</div><div class="filter-row"><span class="filter-label">Uses</span>' + partChips + clear + "</div></div>" + groups + "</div>";
    each("[data-level]", function (b) { b.addEventListener("click", function () { state.level = +b.getAttribute("data-level"); rerender(); }); });
    each("[data-part]", function (b) { b.addEventListener("click", function () { var k = b.getAttribute("data-part"), i = state.parts.indexOf(k); if (i === -1) state.parts.push(k); else state.parts.splice(i, 1); rerender(); }); });
    var c = view.querySelector("[data-clear]");
    if (c) c.addEventListener("click", function () { state.level = 0; state.parts = []; rerender(); });
  }
  function rerender() { var y = window.scrollY; renderProjects(); window.scrollTo(0, y); }

  /* ---------- project sheet ---------- */
  function renderProject(p) {
    setTab("projects");
    var idx = KIT.projects.indexOf(p), prev = KIT.projects[idx - 1], next = KIT.projects[idx + 1];
    var done = Array.isArray(ticks[p.id]) ? ticks[p.id] : [];
    var totalSteps = p.tasks.reduce(function (n, t) { return n + t.steps.length; }, 0);
    var used = {};
    p.wiring.forEach(function (r) { used[r[3]] = r[0]; });
    var isDone = isBuilt(p.id);
    var lines = p.code.split("\n").length;

    var jump = p.tasks.map(function (t, i) { return '<a href="#task-' + (i + 1) + '" data-jump="task-' + (i + 1) + '"><b>' + (i + 1) + "</b>" + esc(t.title) + "</a>"; }).join("") +
      '<a href="#faults" data-jump="faults">Faults</a><a href="#code" data-jump="code">Code</a><span class="count" id="step-count">' + done.length + "/" + totalSteps + " steps</span>";

    view.innerHTML =
      '<div class="p-hero"><div class="wrap"><div><a class="back" href="#projects">← All projects</a>' +
      '<div class="p-meta"><span class="p-no">No. ' + pad2(p.no) + '</span><span class="level">' + pips(p.level) + LEVELS[p.level] + "</span><span>Approximately " + p.minutes + " min</span></div>" +
      "<h1>" + esc(p.title) + '</h1><p class="desc rich">' + fmt(p.description) + "</p>" +
      '<ul class="learn" aria-label="What you learn">' + p.learn.map(function (l) { return '<li class="rich">' + fmt(l) + "</li>"; }).join("") + "</ul>" +
      '<div class="hero-actions"><button class="btn' + (isDone ? " done" : " solid") + '" type="button" id="built-toggle" aria-pressed="' + isDone + '">' + (isDone ? "✓ Built" : "Mark as built") + "</button>" +
      '<button class="btn" type="button" id="reset-steps">Clear step ticks</button></div></div>' +
      "<div>" + pinStrip(used, legendFor(p.parts, p.wiring), false) + "</div></div></div>" +
      '<nav class="jump" aria-label="Jump to"><div class="wrap">' + jump + "</div></nav>" +
      '<div class="wrap"><div class="sheet"><div class="col">' +
      p.tasks.map(function (t, i) { return taskHTML(t, i, p.id, done); }).join("") +
      '<section class="sec" id="faults"><div class="task-head"><span class="task-no">!</span><div><span class="task-sub">If a problem occurs</span><h2>Fault isolation</h2></div></div>' + faultsHTML(p.faults) + "</section>" +
      '<section class="sec"><div class="task-head"><span class="task-no">+</span><div><span class="task-sub">After the test</span><h2>Changes to try</h2></div></div><ul class="changes rich">' + p.changes.map(function (c) { return "<li>" + fmt(c) + "</li>"; }).join("") + "</ul></section>" +
      '</div><div class="col code-col"><section class="sec" id="code"><div class="code-panel"><div class="code-bar"><span class="code-file">' + esc(p.file) + '</span><span class="code-info">' + lines + ' lines</span><span class="spacer"></span><button class="copy" type="button" id="copy-btn">Copy code</button></div>' +
      (p.library ? '<div class="libnote">This sketch needs the <b>' + esc(p.library) + "</b> library. Refer to Setup, task 5.</div>" : "") +
      '<pre class="code" id="code-pre" tabindex="0" aria-label="Sketch code">' + highlight(p.code) + "</pre></div></section></div></div>" +
      '<nav class="pager" aria-label="Other projects">' + (prev ? '<a href="#p-' + prev.id + '"><small>← Previous project</small><b>' + esc(prev.title) + "</b></a>" : "<span></span>") +
      (next ? '<a class="next" href="#p-' + next.id + '"><small>Next project →</small><b>' + esc(next.title) + "</b></a>" : "") + "</nav></div>";

    // jump links scroll within the page instead of changing the route
    each("[data-jump]", function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var t = document.getElementById(a.getAttribute("data-jump"));
        if (t) t.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      });
    });

    function refreshCount() {
      var el = document.getElementById("step-count");
      if (el) el.textContent = done.length + "/" + totalSteps + " steps";
    }
    each("[data-step]", function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-step"), i = done.indexOf(key);
        if (i === -1) done.push(key); else done.splice(i, 1);
        ticks[p.id] = done; save(STEPS_KEY, ticks);
        var now = done.indexOf(key) !== -1, li = b.closest(".step");
        b.setAttribute("aria-pressed", String(now));
        b.textContent = now ? "✓" : String(+key.split(".")[1] + 1);
        b.setAttribute("aria-label", "Step " + (+key.split(".")[1] + 1) + (now ? ", done" : ", mark as done"));
        if (li) li.classList.toggle("done", now);
        refreshCount();
      });
    });
    document.getElementById("reset-steps").addEventListener("click", function () {
      done.length = 0; ticks[p.id] = done; save(STEPS_KEY, ticks);
      each("[data-step]", function (b) {
        var n = +b.getAttribute("data-step").split(".")[1] + 1;
        b.setAttribute("aria-pressed", "false"); b.textContent = String(n); b.setAttribute("aria-label", "Step " + n + ", mark as done");
        var li = b.closest(".step"); if (li) li.classList.remove("done");
      });
      refreshCount();
    });
    document.getElementById("built-toggle").addEventListener("click", function () {
      var i = built.indexOf(p.id);
      if (i === -1) built.push(p.id); else built.splice(i, 1);
      save(BUILT_KEY, built);
      var now = isBuilt(p.id);
      this.classList.toggle("done", now); this.classList.toggle("solid", !now);
      this.setAttribute("aria-pressed", String(now));
      this.textContent = now ? "✓ Built" : "Mark as built";
    });
    var copyBtn = document.getElementById("copy-btn");
    copyBtn.addEventListener("click", function () {
      function fallback() {
        var range = document.createRange(); range.selectNodeContents(document.getElementById("code-pre"));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        copyBtn.textContent = "Code selected. Copy it.";
      }
      function ok() { copyBtn.textContent = "Copied"; copyBtn.classList.add("ok"); setTimeout(function () { copyBtn.textContent = "Copy code"; copyBtn.classList.remove("ok"); }, 2000); }
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(p.code).then(ok, fallback); else fallback(); } catch (e) { fallback(); }
    });
  }

  /* ---------- parts ---------- */
  function renderParts() {
    setTab("parts");
    var homes = {}, counts = {};
    KIT.homePins.forEach(function (h) { (homes[h[1]] = homes[h[1]] || []).push(h[0]); });
    KIT.projects.forEach(function (p) { p.parts.forEach(function (k) { counts[k] = (counts[k] || 0) + 1; }); });
    view.innerHTML = '<div class="wrap"><div class="page-hero"><p class="kicker">The contents of the box</p><h1>Parts</h1><p>This page tells you what each part does, its pins, and the precautions for it. The kit also has a carry case with a tray and a quick start guide.</p></div>' +
      '<div class="parts-grid">' + KIT.parts.map(function (part) {
        var m = part.module;
        var foot = m ? '<div class="part-foot"><span class="homes">Home pins: ' + esc((homes[m] || []).join(", ")) + '</span><button class="linkbtn" type="button" data-show="' + m + '">Show ' + (counts[m] || 0) + " projects</button></div>" : "";
        return '<article class="part"' + (m ? ' style="--mc:' + modVar(m) + '"' : "") + "><h2>" + esc(part.name) + '</h2><p class="rich">' + fmt(part.what) + "</p>" +
          (part.pins.length ? '<div class="pinchips">' + part.pins.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>" : "") +
          '<ul class="rich">' + part.tips.map(function (t) { return "<li>" + fmt(t) + "</li>"; }).join("") + "</ul>" + foot + "</article>";
      }).join("") + "</div></div>";
    each("[data-show]", function (b) {
      b.addEventListener("click", function () { state.level = 0; state.parts = [b.getAttribute("data-show")]; state.listScroll = 0; location.hash = "projects"; });
    });
  }

  /* ---------- pin map ---------- */
  function renderPins() {
    setTab("pins");
    var used = {};
    KIT.homePins.forEach(function (h) { used[h[0]] = h[1]; });
    used["5V"] = "power"; used["GND"] = "ground";
    var legend = MOD_ORDER.map(function (k) { return { color: "var(--b-" + k + ")", label: KIT.modules[k].name }; });
    var rows = KIT.homePins.map(function (h) {
      return '<tr><td class="pinc">' + (PWM[h[0]] ? "~" : "") + esc(h[0]) + '</td><td><span class="mod" style="--mc:' + modVar(h[1]) + '"><i></i>' + esc(KIT.modules[h[1]].name) + "</span></td><td>" + esc(h[2]) + "</td></tr>";
    }).join("");
    view.innerHTML = '<div class="wrap"><div class="page-hero"><p class="kicker">Connect one time, change sketches</p><h1>Pin map</h1><p>All projects on this page use these pins. When a part is connected, it can stay connected while you upload a different sketch. With all the parts connected, the kit uses all 18 signal pins.</p></div>' +
      pinStrip(used, legend, true) +
      '<div class="table-wrap" style="margin-top:22px"><table class="pins-t"><thead><tr><th>Pin</th><th>Part</th><th>Connection</th></tr></thead><tbody>' + rows +
      '<tr><td class="pinc">5V</td><td><span class="mod" style="--mc:var(--p-5v)"><i></i>5V rail</span></td><td>The +, VCC or +5V pin of each part, and the red servo wire</td></tr>' +
      '<tr><td class="pinc">GND</td><td><span class="mod" style="--mc:var(--p-gnd)"><i></i>GND rail</span></td><td>The − or GND pin of each part, the short LED legs, the pushbuttons and the brown servo wire</td></tr></tbody></table></div>' +
      '<div class="two"><div class="box"><h3>Why these pins</h3><ul class="rich">' + KIT.pinNotes.map(function (t) { return "<li>" + fmt(t) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="box" id="power"><h3>Power</h3><div class="caution" role="note" style="margin-bottom:12px"><b>Caution</b>' + fmt(KIT.powerCaution) + '</div><ul class="rich">' + KIT.powerNotes.map(function (t) { return "<li>" + fmt(t) + "</li>"; }).join("") + "</ul></div></div></div>";
  }

  /* ---------- setup ---------- */
  function renderSetup() {
    setTab("setup");
    view.innerHTML = '<div class="wrap"><div class="page-hero"><p class="kicker">Before the first project</p><h1>Setup</h1><p>Do these tasks one time, before the first project. They take approximately 15 minutes.</p></div>' +
      '<div class="setup-tasks">' + KIT.setup.map(function (t, i) { return taskHTML(t, i, null, []); }).join("") + "</div>" +
      '<h2 class="block-title">Rules of the bench</h2><div class="box"><ol class="rich">' + KIT.rules.map(function (r) { return "<li>" + fmt(r) + "</li>"; }).join("") + "</ol></div>" +
      '<h2 class="block-title">If a problem occurs</h2>' + faultsHTML(KIT.setupFaults) + "</div>";
  }

  /* ---------- routing ---------- */
  function route() {
    var h = (location.hash || "").replace(/^#/, "");
    if (/^task-\d+$|^faults$|^code$/.test(h)) return;   // in-page anchors on a project sheet
    if (view.getAttribute("data-view") === "projects") state.listScroll = window.scrollY;
    var target = "projects", proj = null;
    if (h.indexOf("p-") === 0) {
      proj = KIT.projects.filter(function (p) { return p.id === h.slice(2); })[0] || null;
      target = proj ? "project" : "projects";
    } else if (h === "parts" || h === "pins" || h === "setup") target = h;
    if (target === "project") renderProject(proj);
    else if (target === "parts") renderParts();
    else if (target === "pins") renderPins();
    else if (target === "setup") renderSetup();
    else renderProjects();
    view.setAttribute("data-view", target);
    window.scrollTo(0, target === "projects" ? (state.listScroll || 0) : 0);
  }
  function measureTop() {
    var t = document.getElementById("topbar");
    if (t) document.documentElement.style.setProperty("--topbar-h", t.offsetHeight + "px");
  }
  window.addEventListener("resize", measureTop);
  window.addEventListener("hashchange", route);
  measureTop();
  route();
})();
</script>

</body></html>
