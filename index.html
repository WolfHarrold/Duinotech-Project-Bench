OP_SPEED`."], "code": "// Joystick pointer\n// The joystick moves the servo arm. A bigger push gives a faster movement.\n// When you release the joystick, the servo arm stays at its position.\n// Connections:\n//   Joystick VRx       ->  A0\n//   Joystick VRy       ->  A1\n//   Joystick SW        ->  D2\n//   Joystick +5V       ->  5V rail\n//   Joystick GND       ->  GND rail\n//   Servo orange wire  ->  D9\n//   Servo red wire     ->  5V rail\n//   Servo brown wire   ->  GND rail\n\n#include <Servo.h>\n\n// ---- Joystick: VRx -> A0, VRy -> A1, SW -> D2 ----\nconst int JOY_X = A0;\nconst int JOY_Y = A1;\nconst int JOY_SW = 2;\n\n// If a direction is reversed, change false to true.\nconst bool INVERT_X = false;\nconst bool INVERT_Y = false;\n\nconst byte NONE = 0, UP = 1, DOWN = 2, LEFT = 3, RIGHT = 4;\n\nint joyX() {           // 0 = full left, 1023 = full right\n  int v = analogRead(JOY_X);\n  return INVERT_X ? 1023 - v : v;\n}\n\nint joyY() {           // 0 = full down, 1023 = full up\n  int v = analogRead(JOY_Y);\n  return INVERT_Y ? 1023 - v : v;\n}\n\nbyte joyDirection() {  // which way the stick is pushed, or NONE\n  int dx = joyX() - 512;\n  int dy = joyY() - 512;\n  if (abs(dx) < 300 && abs(dy) < 300) return NONE;\n  if (abs(dx) > abs(dy)) return dx > 0 ? RIGHT : LEFT;\n  return dy > 0 ? UP : DOWN;\n}\n\nbool joyClicked() {    // true while the stick is pressed in\n  return digitalRead(JOY_SW) == LOW;\n}\n// ---- end of joystick section ----\n\nconst int SERVO_PIN = 9;\nconst float TOP_SPEED = 3.0;   // degrees per step at full push (one step every 20 ms)\n\nServo arm;\nfloat angle = 90;\n\nvoid setup() {\n  pinMode(JOY_SW, INPUT_PULLUP);\n  arm.attach(SERVO_PIN);\n  arm.write(90);\n}\n\nvoid loop() {\n  int push = joyX() - 512;              // -512 (left) to +511 (right)\n  if (abs(push) > 60) {                 // ignore tiny wobbles near the centre\n    angle += push / 512.0 * TOP_SPEED;\n    angle = constrain(angle, 0, 180);\n  }\n  if (joyClicked()) angle = 90;\n\n  arm.write((int)angle);\n  delay(20);\n}\n"}, {"id": "reaction-timer", "file": "reaction_timer.ino", "no": 13, "title": "Reaction timer", "level": 2, "minutes": 15, "parts": ["buttons", "rgb", "buzzer"], "library": null, "description": "This game measures your reaction time. When the RGB LED becomes green, you push the pushbutton. The Serial Monitor shows the time in milliseconds.", "learn": ["Timing with `millis()`", "`random()` and `randomSeed()`", "How to find a `false` start"], "wiring": [["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"], ["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Put pushbutton A across the centre gap.", "note": "Diagonally opposite legs of a pushbutton are always the switched pair."}, {"t": "Connect pushbutton A:", "rows": [["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"]]}, {"t": "Connect the RGB LED:", "rows": [["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Open the Serial Monitor (⟦Tools › Serial Monitor⟧) and set the speed to 9600 baud."}, {"t": "Make sure that the RGB LED is blue. Blue means ready."}, {"t": "Push pushbutton A to start a round. The RGB LED becomes amber."}, {"t": "When the RGB LED becomes green and the buzzer sounds, push pushbutton A quickly."}, {"t": "Read your time in the Serial Monitor."}, {"t": "Push pushbutton A before green. Make sure that the RGB LED becomes red and the Serial Monitor shows “Too early”."}]}], "faults": [{"fault": "Each round is a `false` start.", "actions": ["Make sure that the two pushbutton connections are on diagonally opposite legs."]}], "changes": ["Calculate the average of five rounds and show it in the Serial Monitor.", "Show your time as a bar on the LED matrix. Use one column for each 50 ms."], "code": "// Reaction timer\n// This game measures your reaction time. When the RGB LED becomes green, you\n// push the pushbutton. The Serial Monitor shows the time in milliseconds.\n// Connections:\n//   Button A one leg                  ->  D4\n//   Button A diagonally opposite leg  ->  GND rail\n//   RGB LED R                         ->  D5\n//   RGB LED G                         ->  D6\n//   RGB LED B                         ->  D3\n//   RGB LED -                         ->  GND rail\n//   Buzzer S                          ->  D8\n//   Buzzer +                          ->  5V rail\n//   Buzzer -                          ->  GND rail\n\nconst int BUTTON = 4;\nconst int BUZZER = 8;\n\n// ---- RGB LED module: R -> D5, G -> D6, B -> D3, - -> GND rail ----\nconst int RGB_RED = 5;\nconst int RGB_GREEN = 6;\nconst int RGB_BLUE = 3;\n\n// If the RGB LED shows white when it must be off, it is common anode.\n// Connect its common pin to the 5V rail and set this to true.\nconst bool COMMON_ANODE = false;\n\nvoid setColor(int red, int green, int blue) {   // each 0 (off) to 255 (full)\n  if (COMMON_ANODE) { red = 255 - red; green = 255 - green; blue = 255 - blue; }\n  analogWrite(RGB_RED, red);\n  analogWrite(RGB_GREEN, green);\n  analogWrite(RGB_BLUE, blue);\n}\n\nvoid rgbBegin() {\n  pinMode(RGB_RED, OUTPUT);\n  pinMode(RGB_GREEN, OUTPUT);\n  pinMode(RGB_BLUE, OUTPUT);\n  setColor(0, 0, 0);\n}\n// ---- end of RGB LED section ----\n\nunsigned long best = 0;      // best time so far (0 = none yet)\nbool seeded = false;\n\nbool buttonDown() {\n  return digitalRead(BUTTON) == LOW;\n}\n\nvoid waitForRelease() {\n  while (buttonDown()) {}\n  delay(20);                 // let the switch settle\n}\n\nvoid falseStart() {\n  setColor(255, 0, 0);\n  tone(BUZZER, 150, 600);\n  Serial.println(\"Too early! Wait for green.\");\n  waitForRelease();\n  delay(1000);\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(BUTTON, INPUT_PULLUP);\n  rgbBegin();\n}\n\nvoid loop() {\n  setColor(0, 0, 255);                  // blue: ready to start\n  Serial.println();\n  Serial.println(\"Press the button to start a round.\");\n  while (!buttonDown()) {}\n  if (!seeded) {                        // the exact moment you pressed makes a good random seed\n    randomSeed(micros());\n    seeded = true;\n  }\n  waitForRelease();\n\n  setColor(255, 90, 0);                 // amber: get ready\n  Serial.println(\"Get ready...\");\n  unsigned long waitTime = random(2000, 5000);\n  unsigned long start = millis();\n  while (millis() - start < waitTime) {\n    if (buttonDown()) {\n      falseStart();\n      return;                           // start loop() again\n    }\n  }\n\n  setColor(0, 255, 0);                  // green: GO!\n  tone(BUZZER, 1800, 80);\n  unsigned long goTime = millis();\n  while (!buttonDown()) {}\n  unsigned long reaction = millis() - goTime;\n\n  Serial.print(\"Your time: \");\n  Serial.print(reaction);\n  Serial.print(\" ms  \");\n  if (reaction < 200) Serial.println(\"Lightning!\");\n  else if (reaction < 250) Serial.println(\"Great\");\n  else if (reaction < 350) Serial.println(\"Good\");\n  else Serial.println(\"Keep practising\");\n\n  if (best == 0 || reaction < best) {\n    best = reaction;\n    Serial.println(\"New best!\");\n    tone(BUZZER, 1319, 150);\n  }\n  Serial.print(\"Best so far: \");\n  Serial.print(best);\n  Serial.println(\" ms\");\n\n  waitForRelease();\n  setColor(0, 0, 0);\n  delay(1500);\n}\n"}, {"id": "dice-roller", "file": "dice_roller.ino", "no": 14, "title": "Dice roller", "level": 2, "minutes": 15, "parts": ["matrix", "buttons", "buzzer"], "library": "LedControl", "description": "When you push the pushbutton, the LED matrix shows dice faces that change slowly. The last face is a random number from 1 to 6.", "learn": ["How to draw into a frame before you show it", "Animation that becomes slower", "Random numbers"], "wiring": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"], ["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Put pushbutton A across the centre gap.", "note": "Diagonally opposite legs of a pushbutton are always the switched pair."}, {"t": "Connect pushbutton A:", "rows": [["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that the LED matrix shows a dice face."}, {"t": "Push pushbutton A."}, {"t": "Make sure that the faces change quickly, then slowly, and then stop."}, {"t": "Make sure that the buzzer makes a click at each change."}]}], "faults": [{"fault": "The dice faces are rotated.", "actions": ["Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values from Matrix hello."]}], "changes": ["Count the result of 60 rolls in the Serial Monitor. Make sure that each number occurs approximately 10 times.", "Show two dice: the first result for 1 second, then the second result."], "code": "// Dice roller\n// When you push the pushbutton, the LED matrix shows dice faces that change\n// slowly. The last face is a random number from 1 to 6.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   LED matrix DIN                    ->  D12\n//   LED matrix CLK                    ->  D11\n//   LED matrix CS                     ->  D10\n//   LED matrix VCC                    ->  5V rail\n//   LED matrix GND                    ->  GND rail\n//   Button A one leg                  ->  D4\n//   Button A diagonally opposite leg  ->  GND rail\n//   Buzzer S                          ->  D8\n//   Buzzer +                          ->  5V rail\n//   Buzzer -                          ->  GND rail\n\n#include <LedControl.h>\n\nconst int BUTTON = 4;\nconst int BUZZER = 8;\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\nvoid drawPip(int x, int y) {       // one 2x2 dot\n  setPixel(x, y, true);\n  setPixel(x + 1, y, true);\n  setPixel(x, y + 1, true);\n  setPixel(x + 1, y + 1, true);\n}\n\nvoid drawFace(int n) {\n  const int L = 0, M = 3, R = 6;   // left/top, middle, right/bottom\n  clearFrame();\n  if (n == 1 || n == 3 || n == 5) drawPip(M, M);         // centre\n  if (n >= 2) { drawPip(L, L); drawPip(R, R); }          // top-left, bottom-right\n  if (n >= 4) { drawPip(R, L); drawPip(L, R); }          // top-right, bottom-left\n  if (n == 6) { drawPip(L, M); drawPip(R, M); }          // middle-left, middle-right\n  showFrame();\n}\n\nint face = 1;\nbool seeded = false;\n\nvoid rollDice() {\n  for (int i = 0; i < 14; i++) {\n    int next = random(1, 7);              // 1 to 6\n    if (next == face) next = next % 6 + 1;  // always change, so it looks like tumbling\n    face = next;\n    drawFace(face);\n    tone(BUZZER, 2500, 8);\n    delay(30 + i * i * 2);                // each tumble a little slower\n  }\n  tone(BUZZER, 1200, 120);\n  Serial.print(\"Rolled a \");\n  Serial.println(face);\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(BUTTON, INPUT_PULLUP);\n  matrixBegin();\n  drawFace(face);\n}\n\nvoid loop() {\n  if (digitalRead(BUTTON) == LOW) {\n    if (!seeded) {\n      randomSeed(micros());\n      seeded = true;\n    }\n    rollDice();\n    while (digitalRead(BUTTON) == LOW) {}   // wait for release\n    delay(20);\n  }\n}\n"}, {"id": "light-theremin", "file": "light_theremin.ino", "no": 15, "title": "Light theremin", "level": 2, "minutes": 10, "parts": ["ldr", "buttons", "buzzer"], "library": null, "description": "You play notes with your hand. Hold the pushbutton and move your hand above the light sensor. Less light gives a lower note.", "learn": ["How to change a sensor value into a sound", "Arrays of musical notes", "How to limit the notes to a scale"], "wiring": [["ldr", "Light sensor", "S", "A2"], ["ldr", "Light sensor", "+", "5V"], ["ldr", "Light sensor", "−", "GND"], ["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Do the Light meter project first. Record your `ROOM_LIT` and `ROOM_DARK` values."}, {"t": "Connect the light sensor:", "rows": [["ldr", "Light sensor", "S", "A2"], ["ldr", "Light sensor", "+", "5V"], ["ldr", "Light sensor", "−", "GND"]]}, {"t": "Put pushbutton A across the centre gap.", "note": "Diagonally opposite legs of a pushbutton are always the switched pair."}, {"t": "Connect pushbutton A:", "rows": [["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `ROOM_LIT` and `ROOM_DARK` to the values that you recorded in Light meter."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Push and hold pushbutton A."}, {"t": "Move your hand slowly down to the light sensor, then up again."}, {"t": "Make sure that the note becomes lower as your hand comes nearer."}, {"t": "Release pushbutton A. Make sure that the sound stops."}]}], "faults": [{"fault": "Only one or two notes play.", "actions": ["Do the Light meter project again.", "Change `ROOM_LIT` and `ROOM_DARK` to the new values."]}, {"fault": "The sound is rough.", "actions": ["No action is necessary. An active buzzer gives a rough sound. A passive buzzer gives clear notes."]}], "changes": ["Set `SNAP_TO_NOTES` to `false`. The pitch then changes smoothly, as on a real theremin.", "Change `NOTES` to a minor scale: 262, 311, 349, 392, 466, 523."], "code": "// Light theremin\n// You play notes with your hand. Hold the pushbutton and move your hand\n// above the light sensor. Less light gives a lower note.\n// Connections:\n//   Light sensor S                    ->  A2\n//   Light sensor +                    ->  5V rail\n//   Light sensor -                    ->  GND rail\n//   Button A one leg                  ->  D4\n//   Button A diagonally opposite leg  ->  GND rail\n//   Buzzer S                          ->  D8\n//   Buzzer +                          ->  5V rail\n//   Buzzer -                          ->  GND rail\n\nconst int LDR = A2;\nconst int BUTTON = 4;\nconst int BUZZER = 8;\n\n// Get these two values from the Light meter project:\nconst int ROOM_LIT = 700;    // value with the room light on\nconst int ROOM_DARK = 200;   // value with your hand above the light sensor\n\n// true: play only the notes of a scale\n// false: change the pitch smoothly, as on a real theremin\nconst bool SNAP_TO_NOTES = true;\n\n// C major pentatonic over two octaves (C D E G A)\nconst int NOTES[] = {262, 294, 330, 392, 440, 523, 587, 659, 784, 880, 1047};\nconst int NOTE_COUNT = sizeof(NOTES) / sizeof(NOTES[0]);\n\nvoid setup() {\n  pinMode(BUTTON, INPUT_PULLUP);\n}\n\nvoid loop() {\n  if (digitalRead(BUTTON) == LOW) {\n    // 0 = hand right over the sensor, 1000 = nothing in the way\n    long amount = map(analogRead(LDR), ROOM_DARK, ROOM_LIT, 0, 1000);\n    amount = constrain(amount, 0, 1000);\n\n    int frequency;\n    if (SNAP_TO_NOTES) frequency = NOTES[amount * (NOTE_COUNT - 1) / 1000];\n    else frequency = map(amount, 0, 1000, 200, 1200);\n\n    tone(BUZZER, frequency);\n  } else {\n    noTone(BUZZER);\n  }\n  delay(20);\n}\n"}, {"id": "object-counter", "file": "object_counter.ino", "no": 16, "title": "Object counter", "level": 2, "minutes": 20, "parts": ["line", "matrix", "buttons", "buzzer"], "library": "LedControl", "description": "The line tracer counts the objects that go near it. The LED matrix shows the count. Each LED on the bottom row adds 100.", "learn": ["How to count changes, not states", "How to ignore an unstable signal", "Numbers in a small font"], "wiring": [["line", "Line tracer", "OUT", "D7"], ["line", "Line tracer", "VCC", "5V"], ["line", "Line tracer", "GND", "GND"], ["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"], ["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Do the Line sensor test project first. Record your `SEES_SOMETHING` value."}, {"t": "Connect the line tracer:", "note": "On some line tracers, the OUT pin has the label S.", "rows": [["line", "Line tracer", "OUT", "D7"], ["line", "Line tracer", "VCC", "5V"], ["line", "Line tracer", "GND", "GND"]]}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Put pushbutton A across the centre gap.", "note": "Diagonally opposite legs of a pushbutton are always the switched pair."}, {"t": "Connect pushbutton A:", "rows": [["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "Change `SEES_SOMETHING` to the value that you recorded."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that the LED matrix shows 0."}, {"t": "Move a white card quickly below the line tracer, approximately 5 mm from it."}, {"t": "Make sure that the count increases by 1 and the buzzer makes a click."}, {"t": "Push pushbutton A. Make sure that the count goes back to 0."}]}], "faults": [{"fault": "The count increases by 2 for one object.", "actions": ["Change the value 30 to 100 in the sketch. This makes the sketch ignore short changes."]}, {"fault": "The count does not increase.", "actions": ["Change `SEES_SOMETHING` from `LOW` to `HIGH`."]}], "changes": ["Count the laps of a toy car. Put the line tracer near the track and white tape on the car.", "Play a short tune at each tenth object."], "code": "// Object counter\n// The line tracer counts the objects that go near it. The LED matrix shows\n// the count. Each LED on the bottom row adds 100.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   Line tracer OUT                   ->  D7\n//   Line tracer VCC                   ->  5V rail\n//   Line tracer GND                   ->  GND rail\n//   LED matrix DIN                    ->  D12\n//   LED matrix CLK                    ->  D11\n//   LED matrix CS                     ->  D10\n//   LED matrix VCC                    ->  5V rail\n//   LED matrix GND                    ->  GND rail\n//   Button A one leg                  ->  D4\n//   Button A diagonally opposite leg  ->  GND rail\n//   Buzzer S                          ->  D8\n//   Buzzer +                          ->  5V rail\n//   Buzzer -                          ->  GND rail\n\n#include <LedControl.h>\n\nconst int LINE = 7;\nconst int BUTTON = 4;\nconst int BUZZER = 8;\n\n// The value when an object is in front of the line tracer.\n// Get this value from the Line sensor test project.\nconst int SEES_SOMETHING = LOW;\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\n// ---- Tiny 3x5 digits for the matrix ----\n// Each digit is 5 rows; in each row 4 = left dot, 2 = middle dot, 1 = right dot.\nconst byte DIGIT_FONT[10][5] = {\n  {7, 5, 5, 5, 7},  // 0\n  {2, 6, 2, 2, 7},  // 1\n  {7, 1, 7, 4, 7},  // 2\n  {7, 1, 7, 1, 7},  // 3\n  {5, 5, 7, 1, 1},  // 4\n  {7, 4, 7, 1, 7},  // 5\n  {7, 4, 7, 5, 7},  // 6\n  {7, 1, 1, 1, 1},  // 7\n  {7, 5, 7, 5, 7},  // 8\n  {7, 5, 7, 1, 7}   // 9\n};\n\nvoid drawDigit(int digit, int left, int top) {\n  for (int row = 0; row < 5; row++)\n    for (int col = 0; col < 3; col++)\n      if (DIGIT_FONT[digit][row] & (4 >> col)) setPixel(left + col, top + row, true);\n}\n\nvoid drawNumber(int n) {            // shows 0 to 99, centred\n  n = constrain(n, 0, 99);\n  if (n >= 10) {\n    drawDigit(n / 10, 1, 1);\n    drawDigit(n % 10, 5, 1);\n  } else {\n    drawDigit(n, 3, 1);\n  }\n}\n// ---- end of digits section ----\n\nint count = 0;\nbool present = false;\nunsigned long changedAt = 0;\n\nvoid showCount() {\n  clearFrame();\n  drawNumber(count % 100);\n  for (int i = 0; i < count / 100 && i < 8; i++) setPixel(i, 7, true);\n  showFrame();\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(LINE, INPUT);\n  pinMode(BUTTON, INPUT_PULLUP);\n  matrixBegin();\n  showCount();\n}\n\nvoid loop() {\n  bool seen = digitalRead(LINE) == SEES_SOMETHING;\n\n  // Only accept a change if the last one was over 30 ms ago (ignores flicker)\n  if (seen != present && millis() - changedAt > 30) {\n    present = seen;\n    changedAt = millis();\n    if (present) {                 // something just arrived: count it\n      count++;\n      tone(BUZZER, 2000, 20);\n      showCount();\n      Serial.print(\"Count: \");\n      Serial.println(count);\n    }\n  }\n\n  if (digitalRead(BUTTON) == LOW) {\n    count = 0;\n    showCount();\n    tone(BUZZER, 600, 100);\n    Serial.println(\"Reset\");\n    while (digitalRead(BUTTON) == LOW) {}\n    delay(20);\n  }\n}\n"}, {"id": "etch-a-sketch", "file": "etch_a_sketch.ino", "no": 17, "title": "Etch-a-sketch", "level": 2, "minutes": 20, "parts": ["joystick", "matrix", "buttons", "buzzer"], "library": "LedControl", "description": "You draw pictures on the LED matrix with the joystick. Pushbutton B sends your picture to the Serial Monitor as code that you can use again.", "learn": ["How to keep a picture separate from the display", "How to set one bit", "Code that writes code"], "wiring": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"], ["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"], ["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"], ["buttons", "Button B", "one leg", "A3"], ["buttons", "Button B", "diagonally opposite leg", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the joystick:", "rows": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"]]}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Put pushbutton A across the centre gap.", "note": "Diagonally opposite legs of a pushbutton are always the switched pair."}, {"t": "Connect pushbutton A:", "rows": [["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"]]}, {"t": "Put pushbutton B across the centre gap."}, {"t": "Connect pushbutton B:", "rows": [["buttons", "Button B", "one leg", "A3"], ["buttons", "Button B", "diagonally opposite leg", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "If you changed `INVERT_X` or `INVERT_Y` in other sketches, make the same changes here."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Move the joystick. Make sure that the cursor moves. The cursor flashes slowly."}, {"t": "Push the joystick down into the module. The cursor flashes quickly. This is the draw mode."}, {"t": "Move the joystick. Make sure that the LEDs stay on behind the cursor."}, {"t": "Push the joystick down again to stop the draw mode."}, {"t": "Open the Serial Monitor (⟦Tools › Serial Monitor⟧) and set the speed to 9600 baud."}, {"t": "Push pushbutton B. Make sure that the Serial Monitor shows your picture as code."}, {"t": "Push pushbutton A. Make sure that the LED matrix becomes clear."}, {"t": "Copy the code from the Serial Monitor into Matrix hello. Use it in place of `SMILE`.", "note": "Matrix hello then shows your picture in place of the face."}]}], "faults": [{"fault": "The cursor moves in the opposite direction.", "actions": ["Set `INVERT_X` or `INVERT_Y` to `true`."]}, {"fault": "The draw mode changes when you push the joystick to the side.", "actions": ["Push the joystick less far. Some joysticks operate their switch at the limit of their movement."]}], "changes": ["Add an eraser: hold pushbutton A for 1 second to change to erase mode.", "Keep four pictures and show them one after the other as an animation."], "code": "// Etch-a-sketch\n// You draw pictures on the LED matrix with the joystick. Pushbutton B sends\n// your picture to the Serial Monitor as code that you can use again.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   Joystick VRx                      ->  A0\n//   Joystick VRy                      ->  A1\n//   Joystick SW                       ->  D2\n//   Joystick +5V                      ->  5V rail\n//   Joystick GND                      ->  GND rail\n//   LED matrix DIN                    ->  D12\n//   LED matrix CLK                    ->  D11\n//   LED matrix CS                     ->  D10\n//   LED matrix VCC                    ->  5V rail\n//   LED matrix GND                    ->  GND rail\n//   Button A one leg                  ->  D4\n//   Button A diagonally opposite leg  ->  GND rail\n//   Button B one leg                  ->  A3\n//   Button B diagonally opposite leg  ->  GND rail\n//   Buzzer S                          ->  D8\n//   Buzzer +                          ->  5V rail\n//   Buzzer -                          ->  GND rail\n\n#include <LedControl.h>\n\nconst int BUTTON_A = 4;\nconst int BUTTON_B = A3;\nconst int BUZZER = 8;\n\n// ---- Joystick: VRx -> A0, VRy -> A1, SW -> D2 ----\nconst int JOY_X = A0;\nconst int JOY_Y = A1;\nconst int JOY_SW = 2;\n\n// If a direction is reversed, change false to true.\nconst bool INVERT_X = false;\nconst bool INVERT_Y = false;\n\nconst byte NONE = 0, UP = 1, DOWN = 2, LEFT = 3, RIGHT = 4;\n\nint joyX() {           // 0 = full left, 1023 = full right\n  int v = analogRead(JOY_X);\n  return INVERT_X ? 1023 - v : v;\n}\n\nint joyY() {           // 0 = full down, 1023 = full up\n  int v = analogRead(JOY_Y);\n  return INVERT_Y ? 1023 - v : v;\n}\n\nbyte joyDirection() {  // which way the stick is pushed, or NONE\n  int dx = joyX() - 512;\n  int dy = joyY() - 512;\n  if (abs(dx) < 300 && abs(dy) < 300) return NONE;\n  if (abs(dx) > abs(dy)) return dx > 0 ? RIGHT : LEFT;\n  return dy > 0 ? UP : DOWN;\n}\n\nbool joyClicked() {    // true while the stick is pressed in\n  return digitalRead(JOY_SW) == LOW;\n}\n// ---- end of joystick section ----\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\nbyte canvas[8];              // what you've drawn, kept apart from the cursor\nint cursorX = 3, cursorY = 3;\nbool penDown = false;\nbool wasClicked = false;\nunsigned long lastMove = 0;\n\nvoid paintAtCursor() {\n  canvas[cursorY] |= (0x80 >> cursorX);\n}\n\nvoid clearCanvas() {\n  for (int y = 0; y < 8; y++) canvas[y] = 0;\n  for (int f = 1200; f > 300; f -= 30) { tone(BUZZER, f); delay(4); }\n  noTone(BUZZER);\n}\n\nvoid printDrawing() {\n  Serial.println(\"const byte MY_DRAWING[8] = {\");\n  for (int y = 0; y < 8; y++) {\n    Serial.print(\"  0b\");\n    for (int x = 0; x < 8; x++) Serial.print((canvas[y] & (0x80 >> x)) ? '1' : '0');\n    Serial.println(y < 7 ? \",\" : \"\");\n  }\n  Serial.println(\"};\");\n  tone(BUZZER, 1800, 60);\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(JOY_SW, INPUT_PULLUP);\n  pinMode(BUTTON_A, INPUT_PULLUP);\n  pinMode(BUTTON_B, INPUT_PULLUP);\n  matrixBegin();\n}\n\nvoid loop() {\n  // Move the cursor one step at a time while the stick is held\n  byte dir = joyDirection();\n  if (dir == NONE) {\n    lastMove = 0;\n  } else if (lastMove == 0 || millis() - lastMove > 160) {\n    if (dir == UP && cursorY > 0) cursorY--;\n    if (dir == DOWN && cursorY < 7) cursorY++;\n    if (dir == LEFT && cursorX > 0) cursorX--;\n    if (dir == RIGHT && cursorX < 7) cursorX++;\n    if (penDown) paintAtCursor();\n    lastMove = millis();\n  }\n\n  // Click the stick: pen up / pen down\n  bool clicked = joyClicked();\n  if (clicked && !wasClicked) {\n    penDown = !penDown;\n    if (penDown) paintAtCursor();\n    tone(BUZZER, penDown ? 1400 : 700, 40);\n    delay(30);\n  }\n  wasClicked = clicked;\n\n  if (digitalRead(BUTTON_A) == LOW) {\n    clearCanvas();\n    while (digitalRead(BUTTON_A) == LOW) {}\n    delay(20);\n  }\n\n  if (digitalRead(BUTTON_B) == LOW) {\n    printDrawing();\n    while (digitalRead(BUTTON_B) == LOW) {}\n    delay(20);\n  }\n\n  // Draw the canvas, then the blinking cursor on top\n  for (int y = 0; y < 8; y++) frame[y] = canvas[y];\n  bool blinkOn = (millis() / (penDown ? 120 : 350)) % 2;\n  setPixel(cursorX, cursorY, blinkOn);\n  showFrame();\n  delay(10);\n}\n"}, {"id": "scrolling-message", "file": "scrolling_message.ino", "no": 18, "title": "Scrolling message", "level": 2, "minutes": 15, "parts": ["matrix"], "library": "LedControl", "description": "Text moves across the LED matrix from right to left. You can enter a new message in the Serial Monitor.", "learn": ["How a font is kept as columns", "`PROGMEM` to save memory", "How to read text from the Serial Monitor"], "wiring": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that HELLO FROM MY UNO moves across the LED matrix."}, {"t": "Open the Serial Monitor (⟦Tools › Serial Monitor⟧) and set the speed to 9600 baud."}, {"t": "Set the line ending menu of the Serial Monitor to ⟦Newline⟧."}, {"t": "Enter a new message and push Enter on the keyboard."}, {"t": "Make sure that the new message starts to move across the LED matrix."}]}], "faults": [{"fault": "The letters are reversed or upside down.", "actions": ["Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values from Matrix hello."]}, {"fault": "A new message does not show.", "actions": ["Set the line ending menu of the Serial Monitor to ⟦Newline⟧."]}], "changes": ["Change `SCROLL_DELAY` to make the text move faster or slower.", "Show the light value: `itoa(analogRead(A2), message, 10)` changes the value into text."], "code": "// Scrolling message\n// Text moves across the LED matrix from right to left. You can enter a new\n// message in the Serial Monitor.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   LED matrix DIN  ->  D12\n//   LED matrix CLK  ->  D11\n//   LED matrix CS   ->  D10\n//   LED matrix VCC  ->  5V rail\n//   LED matrix GND  ->  GND rail\n\n#include <LedControl.h>\n\nconst int SCROLL_DELAY = 70;   // milliseconds per step; smaller = faster\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\n// Classic 5x7 font for the printable characters, space to ~.\n// Each character is 5 columns; in each column, bit 0 is the top dot.\nconst byte FONT[] PROGMEM = {\n  0x00, 0x00, 0x00, 0x00, 0x00,  // space\n  0x00, 0x00, 0x5F, 0x00, 0x00,  // !\n  0x00, 0x07, 0x00, 0x07, 0x00,  // \"\n  0x14, 0x7F, 0x14, 0x7F, 0x14,  // #\n  0x24, 0x2A, 0x7F, 0x2A, 0x12,  // $\n  0x23, 0x13, 0x08, 0x64, 0x62,  // %\n  0x36, 0x49, 0x56, 0x20, 0x50,  // &\n  0x00, 0x08, 0x07, 0x03, 0x00,  // '\n  0x00, 0x1C, 0x22, 0x41, 0x00,  // (\n  0x00, 0x41, 0x22, 0x1C, 0x00,  // )\n  0x2A, 0x1C, 0x7F, 0x1C, 0x2A,  // *\n  0x08, 0x08, 0x3E, 0x08, 0x08,  // +\n  0x00, 0x80, 0x70, 0x30, 0x00,  // ,\n  0x08, 0x08, 0x08, 0x08, 0x08,  // -\n  0x00, 0x00, 0x60, 0x60, 0x00,  // .\n  0x20, 0x10, 0x08, 0x04, 0x02,  // /\n  0x3E, 0x51, 0x49, 0x45, 0x3E,  // 0\n  0x00, 0x42, 0x7F, 0x40, 0x00,  // 1\n  0x72, 0x49, 0x49, 0x49, 0x46,  // 2\n  0x21, 0x41, 0x49, 0x4D, 0x33,  // 3\n  0x18, 0x14, 0x12, 0x7F, 0x10,  // 4\n  0x27, 0x45, 0x45, 0x45, 0x39,  // 5\n  0x3C, 0x4A, 0x49, 0x49, 0x31,  // 6\n  0x41, 0x21, 0x11, 0x09, 0x07,  // 7\n  0x36, 0x49, 0x49, 0x49, 0x36,  // 8\n  0x46, 0x49, 0x49, 0x29, 0x1E,  // 9\n  0x00, 0x00, 0x14, 0x00, 0x00,  // :\n  0x00, 0x40, 0x34, 0x00, 0x00,  // ;\n  0x00, 0x08, 0x14, 0x22, 0x41,  // <\n  0x14, 0x14, 0x14, 0x14, 0x14,  // =\n  0x00, 0x41, 0x22, 0x14, 0x08,  // >\n  0x02, 0x01, 0x59, 0x09, 0x06,  // ?\n  0x3E, 0x41, 0x5D, 0x59, 0x4E,  // @\n  0x7C, 0x12, 0x11, 0x12, 0x7C,  // A\n  0x7F, 0x49, 0x49, 0x49, 0x36,  // B\n  0x3E, 0x41, 0x41, 0x41, 0x22,  // C\n  0x7F, 0x41, 0x41, 0x41, 0x3E,  // D\n  0x7F, 0x49, 0x49, 0x49, 0x41,  // E\n  0x7F, 0x09, 0x09, 0x09, 0x01,  // F\n  0x3E, 0x41, 0x41, 0x51, 0x73,  // G\n  0x7F, 0x08, 0x08, 0x08, 0x7F,  // H\n  0x00, 0x41, 0x7F, 0x41, 0x00,  // I\n  0x20, 0x40, 0x41, 0x3F, 0x01,  // J\n  0x7F, 0x08, 0x14, 0x22, 0x41,  // K\n  0x7F, 0x40, 0x40, 0x40, 0x40,  // L\n  0x7F, 0x02, 0x1C, 0x02, 0x7F,  // M\n  0x7F, 0x04, 0x08, 0x10, 0x7F,  // N\n  0x3E, 0x41, 0x41, 0x41, 0x3E,  // O\n  0x7F, 0x09, 0x09, 0x09, 0x06,  // P\n  0x3E, 0x41, 0x51, 0x21, 0x5E,  // Q\n  0x7F, 0x09, 0x19, 0x29, 0x46,  // R\n  0x26, 0x49, 0x49, 0x49, 0x32,  // S\n  0x03, 0x01, 0x7F, 0x01, 0x03,  // T\n  0x3F, 0x40, 0x40, 0x40, 0x3F,  // U\n  0x1F, 0x20, 0x40, 0x20, 0x1F,  // V\n  0x3F, 0x40, 0x38, 0x40, 0x3F,  // W\n  0x63, 0x14, 0x08, 0x14, 0x63,  // X\n  0x03, 0x04, 0x78, 0x04, 0x03,  // Y\n  0x61, 0x59, 0x49, 0x4D, 0x43,  // Z\n  0x00, 0x7F, 0x41, 0x41, 0x41,  // [\n  0x02, 0x04, 0x08, 0x10, 0x20,  // backslash\n  0x00, 0x41, 0x41, 0x41, 0x7F,  // ]\n  0x04, 0x02, 0x01, 0x02, 0x04,  // ^\n  0x40, 0x40, 0x40, 0x40, 0x40,  // _\n  0x00, 0x03, 0x07, 0x08, 0x00,  // `\n  0x20, 0x54, 0x54, 0x78, 0x40,  // a\n  0x7F, 0x28, 0x44, 0x44, 0x38,  // b\n  0x38, 0x44, 0x44, 0x44, 0x28,  // c\n  0x38, 0x44, 0x44, 0x28, 0x7F,  // d\n  0x38, 0x54, 0x54, 0x54, 0x18,  // e\n  0x00, 0x08, 0x7E, 0x09, 0x02,  // f\n  0x18, 0xA4, 0xA4, 0x9C, 0x78,  // g\n  0x7F, 0x08, 0x04, 0x04, 0x78,  // h\n  0x00, 0x44, 0x7D, 0x40, 0x00,  // i\n  0x20, 0x40, 0x40, 0x3D, 0x00,  // j\n  0x7F, 0x10, 0x28, 0x44, 0x00,  // k\n  0x00, 0x41, 0x7F, 0x40, 0x00,  // l\n  0x7C, 0x04, 0x78, 0x04, 0x78,  // m\n  0x7C, 0x08, 0x04, 0x04, 0x78,  // n\n  0x38, 0x44, 0x44, 0x44, 0x38,  // o\n  0xFC, 0x18, 0x24, 0x24, 0x18,  // p\n  0x18, 0x24, 0x24, 0x18, 0xFC,  // q\n  0x7C, 0x08, 0x04, 0x04, 0x08,  // r\n  0x48, 0x54, 0x54, 0x54, 0x24,  // s\n  0x04, 0x04, 0x3F, 0x44, 0x24,  // t\n  0x3C, 0x40, 0x40, 0x20, 0x7C,  // u\n  0x1C, 0x20, 0x40, 0x20, 0x1C,  // v\n  0x3C, 0x40, 0x30, 0x40, 0x3C,  // w\n  0x44, 0x28, 0x10, 0x28, 0x44,  // x\n  0x4C, 0x90, 0x90, 0x90, 0x7C,  // y\n  0x44, 0x64, 0x54, 0x4C, 0x44,  // z\n  0x00, 0x08, 0x36, 0x41, 0x00,  // {\n  0x00, 0x00, 0x77, 0x00, 0x00,  // |\n  0x00, 0x41, 0x36, 0x08, 0x00,  // }\n  0x02, 0x01, 0x02, 0x04, 0x02,  // ~\n};\n\nchar message[64] = \"HELLO FROM MY UNO\";\nint messageLength;\n\nbyte columnAt(int position) {\n  // The strip is: 8 blank columns, the message (6 columns per letter), 8 blank columns\n  position -= 8;\n  if (position < 0 || position >= messageLength * 6) return 0;\n  char ch = message[position / 6];\n  int col = position % 6;\n  if (col == 5) return 0;                      // gap between letters\n  if (ch < 32 || ch > 126) ch = '?';\n  return pgm_read_byte(&FONT[(ch - 32) * 5 + col]);\n}\n\nvoid checkForNewMessage() {\n  if (Serial.available() == 0) return;\n  char typed[64];\n  int n = Serial.readBytesUntil('\\n', typed, sizeof(typed) - 1);\n  if (n > 0 && typed[n - 1] == '\\r') n--;      // drop a carriage return if sent\n  if (n == 0) return;                          // empty line: keep the old message\n  typed[n] = '\\0';\n  strcpy(message, typed);\n  messageLength = strlen(message);\n  Serial.print(\"Now showing: \");\n  Serial.println(message);\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  Serial.setTimeout(50);\n  matrixBegin();\n  messageLength = strlen(message);\n  Serial.println(\"Type a message and press Enter.\");\n}\n\nvoid loop() {\n  int totalSteps = messageLength * 6 + 8;\n  for (int offset = 0; offset <= totalSteps; offset++) {\n    clearFrame();\n    for (int x = 0; x < 8; x++) {\n      byte column = columnAt(offset + x);\n      for (int y = 0; y < 8; y++) {\n        if (column & (1 << y)) setPixel(x, y, true);\n      }\n    }\n    showFrame();\n    delay(SCROLL_DELAY);\n    if (Serial.available()) {                  // new message: start it straight away\n      checkForNewMessage();\n      return;\n    }\n  }\n}\n"}, {"id": "combination-lock", "file": "combination_lock.ino", "no": 19, "title": "Combination lock", "level": 3, "minutes": 30, "parts": ["joystick", "servo", "rgb", "matrix", "buzzer"], "library": "LedControl", "description": "A secret sequence of joystick movements opens the lock. The servo is the bolt. The RGB LED shows red for locked and green for open.", "learn": ["How to keep inputs in an array", "How to find a single movement", "Two states: locked and open"], "wiring": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"], ["servo", "Servo", "orange wire", "D9"], ["servo", "Servo", "red wire", "5V"], ["servo", "Servo", "brown wire", "GND"], ["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"], ["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the joystick:", "rows": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"]]}, {"t": "Push a plastic horn on the servo shaft."}, {"t": "Connect the servo with three jumper cables:", "note": "On some servos, the GND wire is black and the signal wire is yellow.", "rows": [["servo", "Servo", "orange wire", "D9"], ["servo", "Servo", "red wire", "5V"], ["servo", "Servo", "brown wire", "GND"]]}, {"t": "Connect the RGB LED:", "rows": [["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]]}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Attach a craft stick to the servo horn with tape. This is the bolt."}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "If you changed `INVERT_X` or `INVERT_Y` in other sketches, make the same changes here."}, {"t": "Change `SECRET` to a new code, for example `{LEFT, LEFT, UP, RIGHT}`.", "note": "The code can have a maximum of 8 movements."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that the RGB LED is red and the LED matrix shows a closed lock."}, {"t": "Push the joystick in one direction, then release it to the centre."}, {"t": "Make sure that an arrow shows and one LED comes on in the bottom row."}, {"t": "Do the movements of your code."}, {"t": "Make sure that the RGB LED becomes green and the servo arm moves the bolt."}, {"t": "Push the joystick down into the module. Make sure that the lock closes again."}, {"t": "Enter an incorrect code. Make sure that a cross flashes and the buzzer makes a low sound."}]}], "faults": [{"fault": "One movement counts as two.", "actions": ["Release the joystick fully to the centre after each movement."]}, {"fault": "The UNO board resets when the bolt moves.", "actions": ["Refer to Parts, Servo motor."]}], "changes": ["Lock the joystick for 30 seconds after three incorrect codes.", "Add a doorbell on pushbutton A that plays a short tune."], "code": "// Combination lock\n// A secret sequence of joystick movements opens the lock. The servo is the\n// bolt. The RGB LED shows red for locked and green for open.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   Joystick VRx       ->  A0\n//   Joystick VRy       ->  A1\n//   Joystick SW        ->  D2\n//   Joystick +5V       ->  5V rail\n//   Joystick GND       ->  GND rail\n//   Servo orange wire  ->  D9\n//   Servo red wire     ->  5V rail\n//   Servo brown wire   ->  GND rail\n//   RGB LED R          ->  D5\n//   RGB LED G          ->  D6\n//   RGB LED B          ->  D3\n//   RGB LED -          ->  GND rail\n//   LED matrix DIN     ->  D12\n//   LED matrix CLK     ->  D11\n//   LED matrix CS      ->  D10\n//   LED matrix VCC     ->  5V rail\n//   LED matrix GND     ->  GND rail\n//   Buzzer S           ->  D8\n//   Buzzer +           ->  5V rail\n//   Buzzer -           ->  GND rail\n\n#include <LedControl.h>\n#include <Servo.h>\n\nconst int SERVO_PIN = 9;\nconst int BUZZER = 8;\nconst int LOCKED_ANGLE = 0;    // servo angle with the bolt across\nconst int OPEN_ANGLE = 90;     // servo angle with the bolt pulled back\n\n// ---- Joystick: VRx -> A0, VRy -> A1, SW -> D2 ----\nconst int JOY_X = A0;\nconst int JOY_Y = A1;\nconst int JOY_SW = 2;\n\n// If a direction is reversed, change false to true.\nconst bool INVERT_X = false;\nconst bool INVERT_Y = false;\n\nconst byte NONE = 0, UP = 1, DOWN = 2, LEFT = 3, RIGHT = 4;\n\nint joyX() {           // 0 = full left, 1023 = full right\n  int v = analogRead(JOY_X);\n  return INVERT_X ? 1023 - v : v;\n}\n\nint joyY() {           // 0 = full down, 1023 = full up\n  int v = analogRead(JOY_Y);\n  return INVERT_Y ? 1023 - v : v;\n}\n\nbyte joyDirection() {  // which way the stick is pushed, or NONE\n  int dx = joyX() - 512;\n  int dy = joyY() - 512;\n  if (abs(dx) < 300 && abs(dy) < 300) return NONE;\n  if (abs(dx) > abs(dy)) return dx > 0 ? RIGHT : LEFT;\n  return dy > 0 ? UP : DOWN;\n}\n\nbool joyClicked() {    // true while the stick is pressed in\n  return digitalRead(JOY_SW) == LOW;\n}\n// ---- end of joystick section ----\n\n// ---- RGB LED module: R -> D5, G -> D6, B -> D3, - -> GND rail ----\nconst int RGB_RED = 5;\nconst int RGB_GREEN = 6;\nconst int RGB_BLUE = 3;\n\n// If the RGB LED shows white when it must be off, it is common anode.\n// Connect its common pin to the 5V rail and set this to true.\nconst bool COMMON_ANODE = false;\n\nvoid setColor(int red, int green, int blue) {   // each 0 (off) to 255 (full)\n  if (COMMON_ANODE) { red = 255 - red; green = 255 - green; blue = 255 - blue; }\n  analogWrite(RGB_RED, red);\n  analogWrite(RGB_GREEN, green);\n  analogWrite(RGB_BLUE, blue);\n}\n\nvoid rgbBegin() {\n  pinMode(RGB_RED, OUTPUT);\n  pinMode(RGB_GREEN, OUTPUT);\n  pinMode(RGB_BLUE, OUTPUT);\n  setColor(0, 0, 0);\n}\n// ---- end of RGB LED section ----\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\n// ---- Arrows for the matrix ----\nconst byte ARROW_UP[8] = {\n  0b00011000,\n  0b00111100,\n  0b01111110,\n  0b11011011,\n  0b00011000,\n  0b00011000,\n  0b00011000,\n  0b00011000\n};\n\nvoid drawArrow(byte dir) {     // dir is UP, DOWN, LEFT or RIGHT\n  clearFrame();\n  for (int y = 0; y < 8; y++) {\n    for (int x = 0; x < 8; x++) {\n      if (!(ARROW_UP[y] & (0x80 >> x))) continue;\n      if (dir == UP) setPixel(x, y, true);\n      else if (dir == DOWN) setPixel(x, 7 - y, true);\n      else if (dir == LEFT) setPixel(y, x, true);\n      else setPixel(7 - y, x, true);\n    }\n  }\n  showFrame();\n}\n// ---- end of arrows section ----\n\n// The secret code. Change it to a new code (maximum 8 movements).\nconst byte SECRET[] = {UP, UP, DOWN, DOWN, LEFT, RIGHT};\nconst int CODE_LENGTH = sizeof(SECRET);\n\nconst byte LOCKED_ICON[8] = {\n  0b00111100,\n  0b01000010,\n  0b01000010,\n  0b11111111,\n  0b11100111,\n  0b11100111,\n  0b11111111,\n  0b00000000\n};\n\nconst byte OPEN_ICON[8] = {\n  0b00111100,\n  0b01000010,\n  0b00000010,\n  0b11111111,\n  0b11100111,\n  0b11100111,\n  0b11111111,\n  0b00000000\n};\n\nconst byte CROSS[8] = {\n  0b10000001,\n  0b01000010,\n  0b00100100,\n  0b00011000,\n  0b00011000,\n  0b00100100,\n  0b01000010,\n  0b10000001\n};\n\nServo bolt;\nbyte entered[8];\nint enteredCount = 0;\nbool isOpen = false;\nbyte lastDir = NONE;\nunsigned long lastInput = 0;\n\nvoid showLockScreen() {\n  for (int y = 0; y < 8; y++) frame[y] = isOpen ? OPEN_ICON[y] : LOCKED_ICON[y];\n  for (int i = 0; i < enteredCount; i++) setPixel(i, 7, true);   // progress dots\n  showFrame();\n}\n\nvoid lockUp() {\n  isOpen = false;\n  enteredCount = 0;\n  bolt.write(LOCKED_ANGLE);\n  setColor(255, 0, 0);\n  showLockScreen();\n}\n\nvoid unlock() {\n  isOpen = true;\n  enteredCount = 0;\n  bolt.write(OPEN_ANGLE);\n  setColor(0, 255, 0);\n  showLockScreen();\n  tone(BUZZER, 1047, 100); delay(130);\n  tone(BUZZER, 1319, 100); delay(130);\n  tone(BUZZER, 1568, 250);\n  Serial.println(\"Unlocked. Click the stick to lock.\");\n}\n\nvoid wrongCode() {\n  Serial.println(\"Wrong code\");\n  tone(BUZZER, 150, 500);\n  for (int i = 0; i < 3; i++) {\n    showImage(CROSS);\n    setColor(255, 0, 0);\n    delay(200);\n    clearFrame();\n    showFrame();\n    setColor(0, 0, 0);\n    delay(150);\n  }\n  enteredCount = 0;\n  setColor(255, 0, 0);\n  showLockScreen();\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(JOY_SW, INPUT_PULLUP);\n  rgbBegin();\n  matrixBegin();\n  bolt.attach(SERVO_PIN);\n  lockUp();\n  Serial.println(\"Locked. Enter the code with the joystick.\");\n}\n\nvoid loop() {\n  if (isOpen) {\n    if (joyClicked()) {\n      tone(BUZZER, 400, 100);\n      lockUp();\n      Serial.println(\"Locked\");\n      while (joyClicked()) {}\n      delay(50);\n    }\n    return;\n  }\n\n  byte dir = joyDirection();\n  if (dir != NONE && lastDir == NONE && enteredCount < 8) {   // stick just pushed out\n    entered[enteredCount++] = dir;\n    lastInput = millis();\n    tone(BUZZER, 1000, 30);\n    drawArrow(dir);\n    delay(250);\n    showLockScreen();\n\n    if (enteredCount == CODE_LENGTH) {\n      bool correct = true;\n      for (int i = 0; i < CODE_LENGTH; i++) {\n        if (entered[i] != SECRET[i]) correct = false;\n      }\n      if (correct) unlock();\n      else wrongCode();\n    }\n  }\n  lastDir = dir;\n\n  // Half-entered code and nothing for 5 seconds: start again\n  if (enteredCount > 0 && millis() - lastInput > 5000) {\n    enteredCount = 0;\n    tone(BUZZER, 300, 100);\n    showLockScreen();\n  }\n  delay(10);\n}\n"}, {"id": "simon-says", "file": "simon_says.ino", "no": 20, "title": "Simon says", "level": 3, "minutes": 25, "parts": ["joystick", "rgb", "matrix", "buzzer"], "library": "LedControl", "description": "This is a memory game. The sketch shows a sequence of arrows, colours and notes. You do the same sequence with the joystick. Each round adds one movement.", "learn": ["How to make a sequence in an array", "Time limits for input", "Rounds that become faster"], "wiring": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"], ["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"], ["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the joystick:", "rows": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"]]}, {"t": "Connect the RGB LED:", "rows": [["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]]}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "If you changed `INVERT_X` or `INVERT_Y` in other sketches, make the same changes here."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that one LED moves around the edge of the LED matrix."}, {"t": "Push the joystick down into the module to start."}, {"t": "Look at the arrow and listen to the note."}, {"t": "Push the joystick in the same direction, then release it."}, {"t": "Do the full sequence each round. Each round adds one movement."}, {"t": "Make an incorrect movement. Make sure that the LED matrix shows your score."}, {"t": "Push the joystick down into the module to start a new game."}]}], "faults": [{"fault": "The sketch records an incorrect direction.", "actions": ["Push the joystick fully in each direction. Then release it to the centre."]}], "changes": ["Keep the high score while the power stays on.", "Add a reverse mode. In this mode, you do the sequence from the last movement to the first."], "code": "// Simon says\n// This is a memory game. The sketch shows a sequence of arrows, colours and\n// notes. You do the same sequence with the joystick. Each round adds one\n// movement.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   Joystick VRx    ->  A0\n//   Joystick VRy    ->  A1\n//   Joystick SW     ->  D2\n//   Joystick +5V    ->  5V rail\n//   Joystick GND    ->  GND rail\n//   RGB LED R       ->  D5\n//   RGB LED G       ->  D6\n//   RGB LED B       ->  D3\n//   RGB LED -       ->  GND rail\n//   LED matrix DIN  ->  D12\n//   LED matrix CLK  ->  D11\n//   LED matrix CS   ->  D10\n//   LED matrix VCC  ->  5V rail\n//   LED matrix GND  ->  GND rail\n//   Buzzer S        ->  D8\n//   Buzzer +        ->  5V rail\n//   Buzzer -        ->  GND rail\n\n#include <LedControl.h>\n\nconst int BUZZER = 8;\n\n// ---- Joystick: VRx -> A0, VRy -> A1, SW -> D2 ----\nconst int JOY_X = A0;\nconst int JOY_Y = A1;\nconst int JOY_SW = 2;\n\n// If a direction is reversed, change false to true.\nconst bool INVERT_X = false;\nconst bool INVERT_Y = false;\n\nconst byte NONE = 0, UP = 1, DOWN = 2, LEFT = 3, RIGHT = 4;\n\nint joyX() {           // 0 = full left, 1023 = full right\n  int v = analogRead(JOY_X);\n  return INVERT_X ? 1023 - v : v;\n}\n\nint joyY() {           // 0 = full down, 1023 = full up\n  int v = analogRead(JOY_Y);\n  return INVERT_Y ? 1023 - v : v;\n}\n\nbyte joyDirection() {  // which way the stick is pushed, or NONE\n  int dx = joyX() - 512;\n  int dy = joyY() - 512;\n  if (abs(dx) < 300 && abs(dy) < 300) return NONE;\n  if (abs(dx) > abs(dy)) return dx > 0 ? RIGHT : LEFT;\n  return dy > 0 ? UP : DOWN;\n}\n\nbool joyClicked() {    // true while the stick is pressed in\n  return digitalRead(JOY_SW) == LOW;\n}\n// ---- end of joystick section ----\n\n// ---- RGB LED module: R -> D5, G -> D6, B -> D3, - -> GND rail ----\nconst int RGB_RED = 5;\nconst int RGB_GREEN = 6;\nconst int RGB_BLUE = 3;\n\n// If the RGB LED shows white when it must be off, it is common anode.\n// Connect its common pin to the 5V rail and set this to true.\nconst bool COMMON_ANODE = false;\n\nvoid setColor(int red, int green, int blue) {   // each 0 (off) to 255 (full)\n  if (COMMON_ANODE) { red = 255 - red; green = 255 - green; blue = 255 - blue; }\n  analogWrite(RGB_RED, red);\n  analogWrite(RGB_GREEN, green);\n  analogWrite(RGB_BLUE, blue);\n}\n\nvoid rgbBegin() {\n  pinMode(RGB_RED, OUTPUT);\n  pinMode(RGB_GREEN, OUTPUT);\n  pinMode(RGB_BLUE, OUTPUT);\n  setColor(0, 0, 0);\n}\n// ---- end of RGB LED section ----\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\n// ---- Arrows for the matrix ----\nconst byte ARROW_UP[8] = {\n  0b00011000,\n  0b00111100,\n  0b01111110,\n  0b11011011,\n  0b00011000,\n  0b00011000,\n  0b00011000,\n  0b00011000\n};\n\nvoid drawArrow(byte dir) {     // dir is UP, DOWN, LEFT or RIGHT\n  clearFrame();\n  for (int y = 0; y < 8; y++) {\n    for (int x = 0; x < 8; x++) {\n      if (!(ARROW_UP[y] & (0x80 >> x))) continue;\n      if (dir == UP) setPixel(x, y, true);\n      else if (dir == DOWN) setPixel(x, 7 - y, true);\n      else if (dir == LEFT) setPixel(y, x, true);\n      else setPixel(7 - y, x, true);\n    }\n  }\n  showFrame();\n}\n// ---- end of arrows section ----\n\n// ---- Tiny 3x5 digits for the matrix ----\n// Each digit is 5 rows; in each row 4 = left dot, 2 = middle dot, 1 = right dot.\nconst byte DIGIT_FONT[10][5] = {\n  {7, 5, 5, 5, 7},  // 0\n  {2, 6, 2, 2, 7},  // 1\n  {7, 1, 7, 4, 7},  // 2\n  {7, 1, 7, 1, 7},  // 3\n  {5, 5, 7, 1, 1},  // 4\n  {7, 4, 7, 1, 7},  // 5\n  {7, 4, 7, 5, 7},  // 6\n  {7, 1, 1, 1, 1},  // 7\n  {7, 5, 7, 5, 7},  // 8\n  {7, 5, 7, 1, 7}   // 9\n};\n\nvoid drawDigit(int digit, int left, int top) {\n  for (int row = 0; row < 5; row++)\n    for (int col = 0; col < 3; col++)\n      if (DIGIT_FONT[digit][row] & (4 >> col)) setPixel(left + col, top + row, true);\n}\n\nvoid drawNumber(int n) {            // shows 0 to 99, centred\n  n = constrain(n, 0, 99);\n  if (n >= 10) {\n    drawDigit(n / 10, 1, 1);\n    drawDigit(n % 10, 5, 1);\n  } else {\n    drawDigit(n, 3, 1);\n  }\n}\n// ---- end of digits section ----\n\n// ---- Start screen: a dot runs round the edge until you click the stick ----\nvoid edgePosition(int i, int &x, int &y) {   // 28 spots around the border\n  i = i % 28;\n  if (i < 7)       { x = i;            y = 0; }\n  else if (i < 14) { x = 7;            y = i - 7; }\n  else if (i < 21) { x = 7 - (i - 14); y = 7; }\n  else             { x = 0;            y = 7 - (i - 21); }\n}\n\nvoid waitForClick() {\n  int i = 0;\n  while (!joyClicked()) {\n    clearFrame();\n    for (int tail = 0; tail < 3; tail++) {\n      int x, y;\n      edgePosition(i + 28 - tail, x, y);\n      setPixel(x, y, true);\n    }\n    showFrame();\n    i = (i + 1) % 28;\n    delay(60);\n  }\n  while (joyClicked()) {}   // wait for release\n  delay(30);\n  randomSeed(micros());     // the moment you clicked makes a good random seed\n}\n// ---- end of start screen section ----\n\n// Tone and colour for each direction, in the order NONE, UP, DOWN, LEFT, RIGHT.\n// The notes come from a C major chord, so any sequence sounds tuneful.\n// Up is the highest note and down the lowest.\nconst int TONES[5]   = {0, 523, 262, 330, 392};\nconst byte REDS[5]   = {0, 0,   0,   255, 255};\nconst byte GREENS[5] = {0, 255, 0,   150, 0};\nconst byte BLUES[5]  = {0, 0,   255, 0,   0};\n\nbyte sequence[64];\nint seqLength = 0;\n\nvoid showMove(byte dir, int ms) {\n  drawArrow(dir);\n  setColor(REDS[dir], GREENS[dir], BLUES[dir]);\n  tone(BUZZER, TONES[dir], ms);\n  delay(ms);\n  clearFrame();\n  showFrame();\n  setColor(0, 0, 0);\n}\n\n// Waits for the stick to come back to the middle, then for the next push.\n// Returns the direction, or NONE if you took too long.\nbyte waitForMove(unsigned long timeout) {\n  unsigned long start = millis();\n  while (joyDirection() != NONE) {\n    if (millis() - start > timeout) return NONE;\n  }\n  while (millis() - start < timeout) {\n    byte dir = joyDirection();\n    if (dir != NONE) return dir;\n  }\n  return NONE;\n}\n\nvoid gameOver(int score) {\n  Serial.print(\"Game over. Score: \");\n  Serial.println(score);\n  tone(BUZZER, 120, 800);\n  for (int i = 0; i < 3; i++) {\n    setColor(255, 0, 0);\n    for (int y = 0; y < 8; y++) frame[y] = 0xFF;\n    showFrame();\n    delay(150);\n    setColor(0, 0, 0);\n    clearFrame();\n    showFrame();\n    delay(150);\n  }\n  clearFrame();\n  drawNumber(score);\n  showFrame();\n  while (!joyClicked()) {}     // score stays up until you click\n  while (joyClicked()) {}\n  delay(30);\n  seqLength = 0;\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(JOY_SW, INPUT_PULLUP);\n  rgbBegin();\n  matrixBegin();\n}\n\nvoid loop() {\n  if (seqLength == 0) {\n    Serial.println(\"Click the stick to start.\");\n    waitForClick();\n    delay(400);\n  }\n\n  // Add one more move, then play the whole sequence\n  sequence[seqLength++] = random(1, 5);     // UP, DOWN, LEFT or RIGHT\n  delay(500);\n  int speed = max(180, 520 - seqLength * 25);\n  for (int i = 0; i < seqLength; i++) {\n    showMove(sequence[i], speed);\n    delay(100);\n  }\n\n  // Your turn\n  for (int i = 0; i < seqLength; i++) {\n    byte move = waitForMove(3000);\n    if (move != sequence[i]) {\n      gameOver(seqLength - 1);\n      return;\n    }\n    showMove(move, 200);\n  }\n\n  if (seqLength == 64) {                     // finished the whole thing\n    Serial.println(\"You beat Simon!\");\n    gameOver(64);\n  }\n}\n"}, {"id": "snake", "file": "snake.ino", "no": 21, "title": "Snake", "level": 3, "minutes": 25, "parts": ["joystick", "matrix", "buzzer"], "library": "LedControl", "description": "This is the game Snake on the LED matrix. You move the snake to the flashing LED. Each LED makes the snake longer and faster.", "learn": ["An array as a body that moves", "How to find a collision", "Game steps timed with `millis()`"], "wiring": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"], ["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the joystick:", "rows": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"]]}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Make sure that the LedControl library is installed. Refer to Setup, task 5."}, {"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `SWAP_XY`, `FLIP_X` and `FLIP_Y` to the values that you found in Matrix hello."}, {"t": "If you changed `INVERT_X` or `INVERT_Y` in other sketches, make the same changes here."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Push the joystick down into the module to start."}, {"t": "Move the joystick to move the snake to the flashing LED."}, {"t": "Make sure that the snake becomes longer and the buzzer makes a
