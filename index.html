<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Duinotech Project Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a bold workshop manual. Index of build cards; each project opens as a task sheet
   (Connect, Upload, Test) with STE-style numbered steps, cautions before the step, and code alongside.
   The project hero is the UNO board itself: a PCB-teal band carrying the lit pin header. */
:root {
  --paper: #F3F5F4;
  --surface: #FFFFFF;
  --sunken: #E6EBEA;
  --ink: #0B1316;
  --muted: #56656A;
  --line: #D3DBDA;
  --bar: #0B1316;
  --bar-ink: #F3F5F4;
  --accent: #00728C;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3ECF1;
  --pcb: #0A5B6E;
  --pcb-deep: #073F4D;
  --pcb-ink: #EAF7F9;
  --pad: #DDBC66;
  --hole: #052A33;
  --caution: #F4B000;
  --caution-bg: #FFF3C7;
  --caution-ink: #2B1F00;
  --warning: #D7372B;
  --ok: #10855A;
  --ok-ink: #FFFFFF;
  --code-bg: #0C1B20;
  --code-ink: #DCE8E6;
  --code-dim: #6E8A8E;

  --m-leds: #B46C00;
  --m-buttons: #6A45C2;
  --m-servo: #C44A18;
  --m-ldr: #877100;
  --m-rgb: #B02A70;
  --m-joystick: #2757C2;
  --m-buzzer: #117B52;
  --m-matrix: #527B00;
  --m-line: #80532A;
  --p-5v: #CC2336;
  --p-gnd: #2B3537;

  --b-leds: #F4AC3D;
  --b-buttons: #B7A0F7;
  --b-servo: #F78A5E;
  --b-ldr: #E8D45E;
  --b-rgb: #F381BB;
  --b-joystick: #88AEF9;
  --b-buzzer: #5DD69C;
  --b-matrix: #B3DE50;
  --b-line: #DBA876;
  --b-5v: #FF6E7B;
  --b-gnd: #C7D0D1;

  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px;
  --gutter: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #090E10; --surface: #11191C; --sunken: #0D1416; --ink: #E8EFEE; --muted: #95A6A9; --line: #233034;
    --bar: #04080A; --bar-ink: #E8EFEE; --accent: #3CC4E0; --accent-ink: #04222A; --accent-soft: #10343D;
    --pcb: #08495A; --pcb-deep: #052F3A; --pcb-ink: #DDF0F3; --pad: #CFAD5F; --hole: #03161B;
    --caution: #FFC531; --caution-bg: #2D2307; --caution-ink: #FFE7A3; --warning: #FF6A5C; --ok: #43C98A; --ok-ink: #04130C;
    --code-bg: #060F12; --code-ink: #D7E5E3; --code-dim: #67828A;
    --m-leds: #F4AC3D; --m-buttons: #AC92F4; --m-servo: #F5865A; --m-ldr: #DECA4E; --m-rgb: #F079B5;
    --m-joystick: #7EA6F7; --m-buzzer: #52CD91; --m-matrix: #A8D645; --m-line: #D19F6C; --p-5v: #F2626F; --p-gnd: #A9B6B8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #090E10; --surface: #11191C; --sunken: #0D1416; --ink: #E8EFEE; --muted: #95A6A9; --line: #233034;
  --bar: #04080A; --bar-ink: #E8EFEE; --accent: #3CC4E0; --accent-ink: #04222A; --accent-soft: #10343D;
  --pcb: #08495A; --pcb-deep: #052F3A; --pcb-ink: #DDF0F3; --pad: #CFAD5F; --hole: #03161B;
  --caution: #FFC531; --caution-bg: #2D2307; --caution-ink: #FFE7A3; --warning: #FF6A5C; --ok: #43C98A; --ok-ink: #04130C;
  --code-bg: #060F12; --code-ink: #D7E5E3; --code-dim: #67828A;
  --m-leds: #F4AC3D; --m-buttons: #AC92F4; --m-servo: #F5865A; --m-ldr: #DECA4E; --m-rgb: #F079B5;
  --m-joystick: #7EA6F7; --m-buzzer: #52CD91; --m-matrix: #A8D645; --m-line: #D19F6C; --p-5v: #F2626F; --p-gnd: #A9B6B8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 120px; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16.5px; line-height: 1.55; margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.02; letter-spacing: 0.005em; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: var(--gutter); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* inline text styles */
.rich code, .rich .ui { font-size: 0.86em; border-radius: 5px; padding: 0.06em 0.38em; overflow-wrap: anywhere; }
.rich code { font-family: var(--f-mono); background: var(--sunken); border: 1px solid var(--line); }
.rich .ui { font-family: var(--f-body); font-weight: 700; font-size: 0.92em; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 2px 0 var(--line); white-space: normal; }
.rich .pinref { font-family: var(--f-mono); font-weight: 600; font-size: 0.88em; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
.top-inner { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--bar-ink); text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
.brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--pcb); box-shadow: 0 0 0 3px var(--pad); }
.brand small { font-family: var(--f-mono); font-weight: 400; font-size: 11px; letter-spacing: 0.08em; opacity: 0.65; }
.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; color: var(--bar-ink); opacity: 0.7; padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
.tab:hover { opacity: 1; background: rgba(255,255,255,0.08); }
.tab[aria-current="page"] { opacity: 1; background: var(--accent); color: var(--accent-ink); }
@media (max-width: 640px) {
  .brand small { display: none; }
  .tabs { margin-left: 0; width: 100%; justify-content: space-between; }
  .tab { font-size: 15px; padding: 6px 9px; }
}

main { padding-block: 0 72px; }

/* ---------- buttons, chips ---------- */
.btn { font: inherit; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: 2px solid currentColor; background: transparent; color: inherit; cursor: pointer; text-decoration: none; }
.btn.solid { background: var(--pcb-ink); color: var(--pcb-deep); border-color: var(--pcb-ink); }
.btn.done { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }
.chip { font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; line-height: 1.25; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mc, var(--muted)); flex: none; }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--paper); }
.chip.clear { border-style: dashed; color: var(--muted); }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border: 1.5px solid currentColor; border-radius: 1px; opacity: 0.55; }
.pips i.on { background: currentColor; opacity: 1; }
.level { display: inline-flex; align-items: center; gap: 7px; }

/* ---------- index ---------- */
.hero-index { padding-block: 34px 26px; display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: end; border-bottom: 3px solid var(--ink); margin-bottom: 22px; }
@media (min-width: 900px) { .hero-index { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
.kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.hero-index h1 { font-weight: 800; font-size: clamp(46px, 10vw, 104px); text-transform: uppercase; line-height: 0.9; }
.hero-index h1 em { font-style: normal; color: var(--accent); }
.hero-index .lede { margin: 16px 0 0; font-size: 18px; max-width: 58ch; }
.progress { border: 2px solid var(--ink); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; background: var(--surface); }
.progress-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.progress-num { font-family: var(--f-display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.progress-num small { font-size: 22px; color: var(--muted); }
.progress-label { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
.bar { height: 10px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; transition: width 0.3s ease; }
.progress p { margin: 0; font-size: 14px; color: var(--muted); }

.filters { display: grid; gap: 10px; margin-bottom: 26px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.filter-label { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); min-width: 52px; }

.group + .group { margin-top: 38px; }
.group-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.group-head h2 { font-weight: 800; font-size: 36px; text-transform: uppercase; }
.group-head p { margin: 0; color: var(--muted); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.card { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; text-decoration: none; color: inherit; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 14px 16px 14px; min-width: 0; transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease; }
.card:hover { border-color: var(--ink); box-shadow: 5px 5px 0 var(--ink); transform: translate(-2px, -2px); }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-no { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 0.9; color: var(--accent); font-variant-numeric: tabular-nums; }
.card-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.card h3 { font-weight: 700; font-size: 27px; text-transform: uppercase; }
.card p { margin: 0; font-size: 15px; }
.card-parts { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); padding-top: 8px; border-top: 1.5px dashed var(--line); }
.card-parts span { display: inline-flex; align-items: center; gap: 5px; }
.card-parts .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mc); }
.badge-built { font-family: var(--f-display); font-weight: 800; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ok-ink); background: var(--ok); padding: 2px 8px; border-radius: 5px; }
.empty { padding: 30px 18px; border: 2px dashed var(--line); border-radius: var(--r); text-align: center; color: var(--muted); }

/* ---------- PCB pin strip ---------- */
.board { color: var(--pcb-ink); display: grid; gap: 12px; padding: 12px; border-radius: 12px; background: rgba(0,0,0,0.18); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); min-width: 0; }
.board.standalone { background: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1px, transparent 1.5px) 0 0 / 10px 10px, linear-gradient(180deg, var(--pcb), var(--pcb-deep)); }
.hdr { display: grid; gap: 4px; min-width: 0; }
.hdr-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
.pins { display: grid; gap: 2px; }
.pins.d { grid-template-columns: repeat(14, minmax(0, 1fr)); }
.pins.p { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.pins.a { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.hdr-row2 { display: grid; grid-template-columns: 2fr 6fr; gap: 14px; }
.pin { display: grid; justify-items: center; gap: 3px; min-width: 0; }
.pad { width: 15px; height: 15px; border-radius: 50%; background: var(--hole); box-shadow: 0 0 0 3px var(--pad); margin: 3px 0 2px; opacity: 0.4; }
.pin.used .pad { opacity: 1; background: var(--pc); box-shadow: 0 0 0 3px var(--pad), 0 0 12px 2px var(--pc); }
.pin.dead .pad { opacity: 0.18; }
.silk { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; white-space: nowrap; opacity: 0.55; }
.pin.used .silk { opacity: 1; }
.tagv { font-family: var(--f-mono); font-size: 9px; font-weight: 600; letter-spacing: 0.06em; writing-mode: vertical-rl; transform: rotate(180deg); min-height: 30px; color: var(--pc); opacity: 0; }
.pin.used .tagv { opacity: 1; }
.board-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.14); }
.board-legend span { display: inline-flex; align-items: center; gap: 6px; }
.board-legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--pc); }
@media (max-width: 420px) {
  .pad { width: 12px; height: 12px; box-shadow: 0 0 0 2.5px var(--pad); }
  .pin.used .pad { box-shadow: 0 0 0 2.5px var(--pad), 0 0 8px 1px var(--pc); }
  .silk { font-size: 9px; }
  .board { padding: 10px 7px 8px; }
}

/* ---------- project hero (the board) ---------- */
.p-hero { background: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.07) 1px, transparent 1.5px) 0 0 / 10px 10px, linear-gradient(180deg, var(--pcb), var(--pcb-deep)); color: var(--pcb-ink); }
.p-hero .wrap { padding-block: 22px 26px; display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .p-hero .wrap { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: end; } }
.p-hero a.back { color: var(--pcb-ink); opacity: 0.8; font-family: var(--f-mono); font-size: 13px; text-decoration: none; }
.p-hero a.back:hover { opacity: 1; text-decoration: underline; }
.p-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-family: var(--f-mono); font-size: 12.5px; margin: 14px 0 8px; }
.p-no { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--pad); letter-spacing: 0.04em; }
.p-hero h1 { font-weight: 800; text-transform: uppercase; font-size: clamp(48px, 11vw, 96px); line-height: 0.88; }
.p-hero .desc { margin: 14px 0 0; font-size: 18px; max-width: 56ch; }
.learn { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; padding: 0; list-style: none; }
.learn li { font-size: 13.5px; padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.12); }
.learn li code { background: transparent; border: 0; padding: 0; color: inherit; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* task jump bar */
.jump { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h, 56px)); z-index: 15; background: var(--paper); border-bottom: 2px solid var(--ink); }
.jump .wrap { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-block: 8px; scrollbar-width: none; }
.jump .wrap::-webkit-scrollbar { display: none; }
.jump a { flex: none; font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: var(--ink); padding: 5px 10px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); }
.jump a:hover { border-color: var(--ink); }
.jump a b { color: var(--accent); margin-right: 4px; }
.jump .count { margin-left: auto; flex: none; font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-left: 10px; font-variant-numeric: tabular-nums; }

.sheet { display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr); padding-top: 26px; }
@media (min-width: 1060px) {
  .sheet { grid-template-columns: minmax(0, 1fr) minmax(0, 0.95fr); align-items: start; }
  .code-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h, 56px) + 62px); }
  .code-col pre { max-height: calc(100vh - 230px); }
}
.col { display: grid; gap: 40px; min-width: 0; }
.sec { min-width: 0; }

/* task blocks */
.task-head { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: end; gap: 14px; padding-bottom: 10px; border-bottom: 3px solid var(--ink); margin-bottom: 18px; }
.task-no { font-family: var(--f-display); font-weight: 800; font-size: 64px; line-height: 0.78; color: var(--accent); font-variant-numeric: tabular-nums; }
.task-head h2 { font-weight: 800; font-size: 34px; text-transform: uppercase; }
.task-head .task-sub { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.step { display: grid; gap: 10px; }
.step-row { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px; align-items: start; }
.step-no { font: inherit; font-family: var(--f-display); font-weight: 800; font-size: 24px; width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); cursor: pointer; padding: 0; transition: background 0.15s ease; }
.step-no:hover { background: var(--accent-soft); }
.step-no[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); font-size: 22px; }
.step-body { padding-top: 9px; min-width: 0; }
.step-body > p { margin: 0; font-size: 17px; }
.step.done .step-body > p { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: var(--ok); }
.note { margin-top: 10px; padding: 8px 12px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: 15px; }
.note b, .caution b, .warning b { font-family: var(--f-display); font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 8px; }
.caution, .warning { border-radius: 10px; padding: 12px 14px 12px 22px; position: relative; overflow: hidden; font-weight: 700; font-size: 15.5px; }
.caution { background: var(--caution-bg); color: var(--caution-ink); border: 2px solid var(--caution); }
.caution::before, .warning::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: repeating-linear-gradient(-45deg, var(--caution) 0 6px, #111 6px 12px); }
.warning { background: var(--warning); color: #fff; border: 2px solid var(--warning); }
.warning::before { background: repeating-linear-gradient(-45deg, #fff 0 6px, var(--warning) 6px 12px); }
.caution b { color: inherit; }

.pinrows { display: grid; gap: 4px; margin-top: 10px; }
.pinrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1.5px solid var(--line); border-left: 6px solid var(--mc); font-size: 15px; }
.pinrow .from { min-width: 0; overflow-wrap: anywhere; }
.pinrow .arrow { color: var(--muted); font-family: var(--f-mono); }
.dest { font-family: var(--f-mono); font-weight: 600; font-size: 13.5px; padding: 2px 9px; border-radius: 6px; background: var(--ink); color: var(--paper); white-space: nowrap; }
.dest.rail-5v { background: var(--p-5v); color: #fff; }
.dest.rail-gnd { background: var(--sunken); color: var(--ink); border: 1.5px solid var(--ink); }

.faults { display: grid; gap: 10px; }
.fault { border: 2px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.fault-q { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 10px 14px; background: var(--sunken); font-weight: 700; }
.fault-q span { font-family: var(--f-display); font-weight: 800; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warning); }
.fault ol { margin: 0; padding: 10px 14px 12px 36px; display: grid; gap: 6px; }
.changes { margin: 0; padding-left: 20px; display: grid; gap: 8px; }

.code-panel { background: var(--code-bg); color: var(--code-ink); border-radius: 14px; overflow: hidden; min-width: 0; }
.code-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; }
.code-file { font-family: var(--f-mono); font-size: 13px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.code-info { font-family: var(--f-mono); font-size: 11.5px; color: var(--code-dim); }
.code-bar .spacer { flex: 1; }
.copy { font: inherit; font-size: 14px; font-weight: 700; background: var(--b-buzzer); color: #05231A; border: 0; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.copy.ok { background: #EAF7F1; }
.libnote { font-size: 13.5px; padding: 8px 14px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.08); }
.libnote b { color: var(--b-leds); }
pre.code { margin: 0; padding: 12px 0 16px; overflow: auto; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; tab-size: 2; counter-reset: ln; }
pre.code .ln { display: block; padding-right: 16px; white-space: pre; }
pre.code .ln::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 3.4em; padding-right: 1em; text-align: right; color: var(--code-dim); opacity: 0.6; user-select: none; -webkit-user-select: none; }
.t-com { color: #7F9B9E; font-style: italic; }
.t-str { color: #A6E3B0; }
.t-num { color: #F4A3AE; }
.t-pre { color: #C8B2FF; }
.t-kw { color: #7FD4E8; }
.t-fn { color: #F6C978; }
.t-const { color: #F59E6B; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 44px; flex-wrap: wrap; }
.pager a { flex: 1 1 240px; text-decoration: none; color: inherit; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 12px 16px; min-width: 0; }
.pager a:hover { border-color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
.pager small { display: block; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.pager b { font-family: var(--f-display); font-weight: 800; font-size: 24px; text-transform: uppercase; }
.pager .next { text-align: right; }

/* ---------- other pages ---------- */
.page-hero { padding-block: 34px 22px; border-bottom: 3px solid var(--ink); margin-bottom: 26px; display: grid; gap: 10px; }
.page-hero h1 { font-weight: 800; font-size: clamp(46px, 10vw, 96px); text-transform: uppercase; line-height: 0.9; }
.page-hero p { margin: 0; max-width: 60ch; font-size: 18px; }
.parts-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.part { background: var(--surface); border: 2px solid var(--line); border-top: 8px solid var(--mc, var(--ink)); border-radius: var(--r); padding: 14px 16px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.part h2 { font-weight: 800; font-size: 28px; text-transform: uppercase; }
.part p { margin: 0; }
.pinchips { display: flex; flex-wrap: wrap; gap: 4px; }
.pinchips span { font-family: var(--f-mono); font-size: 12px; padding: 2px 7px; border-radius: 5px; background: var(--sunken); border: 1px solid var(--line); }
.part ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15px; }
.part-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding-top: 10px; border-top: 1.5px dashed var(--line); font-size: 14px; }
.part-foot .homes { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.linkbtn { font: inherit; font-size: 15px; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); }
table.pins-t { width: 100%; border-collapse: collapse; font-size: 15px; }
.pins-t th, .pins-t td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.pins-t tr:last-child td { border-bottom: 0; }
.pins-t th { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--sunken); }
.pins-t td.pinc { font-family: var(--f-mono); font-weight: 600; white-space: nowrap; }
.pins-t .mod { display: inline-flex; align-items: center; gap: 7px; }
.pins-t .mod i { width: 10px; height: 10px; border-radius: 50%; background: var(--mc); flex: none; }
@media (max-width: 480px) { .pins-t th, .pins-t td { padding: 8px 10px; font-size: 14px; } }
.two { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); margin-top: 22px; }
.box { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.box h3 { font-weight: 800; font-size: 24px; text-transform: uppercase; margin-bottom: 8px; }
.box ul, .box ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.block-title { font-weight: 800; font-size: 34px; text-transform: uppercase; margin: 40px 0 14px; }
.setup-tasks { display: grid; gap: 34px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

ws in the Serial Monitor."}]}], "faults": [{"fault": "No port shows in ⟦Tools › Port⟧.", "actions": ["Use a different USB cable. Some cables can only charge a phone.", "Connect the USB cable to a different USB socket on the computer.", "Refer to Setup, “If a problem occurs”."]}, {"fault": "The upload stops with “not in sync” or “programmer is not responding”.", "actions": ["Make sure that ⟦Tools › Board⟧ is set to Arduino Uno.", "Make sure that ⟦Tools › Port⟧ is set to the port of the UNO board."]}], "changes": ["Change the two `delay(500)` lines to `delay(100)`. The L LED flashes faster.", "Make the L LED flash SOS: three short flashes, three long flashes, then three short flashes."], "code": "// First upload\n// The UNO board makes its L LED flash and sends a message to the computer.\n// This shows that the computer, the cable and the board operate correctly.\n// Connections: none. Connect only the USB cable.\n\nvoid setup() {\n  pinMode(LED_BUILTIN, OUTPUT);   // the \"L\" LED is wired to pin 13 on the board\n  Serial.begin(9600);             // Serial Monitor speed: 9600 baud\n  Serial.println(\"Hello from your Uno!\");\n}\n\nvoid loop() {\n  digitalWrite(LED_BUILTIN, HIGH);  // LED on\n  delay(500);                       // wait half a second\n  digitalWrite(LED_BUILTIN, LOW);   // LED off\n  delay(500);\n}\n"}, {"id": "traffic-light", "file": "traffic_light.ino", "no": 2, "title": "Traffic light", "level": 1, "minutes": 20, "parts": ["leds"], "library": null, "description": "Three LEDs operate as a traffic light. The green, yellow and red LEDs come on in a timed sequence.", "learn": ["How to connect an LED with a resistor", "`digitalWrite()` and `delay()`", "How to write a function"], "wiring": [["leds", "Red LED", "long leg, through 220 Ω", "D13"], ["leds", "Yellow LED", "long leg, through 220 Ω", "A4"], ["leds", "Green LED", "long leg, through 220 Ω", "A5"], ["leds", "All LEDs", "short legs", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": come on.", "actions": ["Disconnect the USB cable.", "Turn the LED so that its long leg is on the resistor side."]}, {"fault": "The LEDs are very dim.", "actions": ["Make sure that the resistors have red, red and brown bands.", "Replace a 10 kΩ resistor (brown, black, orange) with a 220 Ω resistor."]}], "changes": ["Change `GREEN_TIME`, `YELLOW_TIME` and `RED_TIME` to change the sequence times.", "Add a night mode that makes only the yellow LED flash."], "code": "// Traffic light\n// Three LEDs operate as a traffic light. The green, yellow and red LEDs come\n// on in a timed sequence.\n// Connections:\n//   Red LED long leg, through 220 Ω     ->  D13\n//   Yellow LED long leg, through 220 Ω  ->  A4\n//   Green LED long leg, through 220 Ω   ->  A5\n//   All LEDs short legs                 ->  GND rail\n\nconst int RED = 13;\nconst int YELLOW = A4;\nconst int GREEN = A5;\n\n// Times in milliseconds (1000 ms = 1 second)\nconst unsigned long GREEN_TIME = 5000;\nconst unsigned long YELLOW_TIME = 2000;\nconst unsigned long RED_TIME = 5000;\n\nvoid showLights(int red, int yellow, int green, unsigned long howLong) {\n  digitalWrite(RED, red);\n  digitalWrite(YELLOW, yellow);\n  digitalWrite(GREEN, green);\n  delay(howLong);\n}\n\nvoid setup() {\n  pinMode(RED, OUTPUT);\n  pinMode(YELLOW, OUTPUT);\n  pinMode(GREEN, OUTPUT);\n}\n\nvoid loop() {\n  showLights(LOW, LOW, HIGH, GREEN_TIME);   // green: go\n  showLights(LOW, HIGH, LOW, YELLOW_TIME);  // yellow: prepare to stop\n  showLights(HIGH, LOW, LOW, RED_TIME);     // red: stop\n}\n"}, {"id": "light-meter", "file": "light_meter.ino", "no": 3, "title": "Light meter", "level": 1, "minutes": 10, "parts": ["ldr"], "library": null, "description": "The light sensor gives a value from 0 to 1023. The Serial Plotter shows this value as a live graph. You use these values in other projects.", "learn": ["`analogRead()` and the 0 to 1023 range", "The Serial Plotter", "How to calibrate a sensor"], "wiring": [["ldr", "Light sensor", "S", "A2"], ["ldr", "Light sensor", "+", "5V"], ["ldr", "Light sensor", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the light sensor:", "rows": [["ldr", "Light sensor", "S", "A2"], ["ldr", "Light sensor", "+", "5V"], ["ldr", "Light sensor", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Open the Serial Plotter (⟦Tools › Serial Plotter⟧) and set the speed to 9600 baud."}, {"t": "Make sure that a line moves on the graph."}, {"t": "With the room light on, record the light value. This is your `ROOM_LIT` value."}, {"t": "Put your hand above the light sensor, approximately 10 mm from it."}, {"t": "Record the light value. This is your `ROOM_DARK` value.", "note": "The night light, the theremin and the light seeker use `ROOM_LIT` and `ROOM_DARK`."}]}], "faults": [{"fault": "The value stays at 0 or 1023.", "actions": ["Make sure that the S pin connects to A2.", "Make sure that the + pin connects to the 5V rail and the − pin connects to the GND rail."]}, {"fault": "The value decreases when there is more light.", "actions": ["No action is necessary. Some light sensors operate this way. The other sketches can use the two types."]}], "changes": ["Put a phone torch near the light sensor. Record the maximum value.", "Make the L LED come on when the value is halfway between `ROOM_LIT` and `ROOM_DARK`."], "code": "// Light meter\n// The light sensor gives a value from 0 to 1023. The Serial Plotter shows\n// this value as a live graph. You use these values in other projects.\n// Connections:\n//   Light sensor S  ->  A2\n//   Light sensor +  ->  5V rail\n//   Light sensor -  ->  GND rail\n\nconst int LDR = A2;\n\nint lowest = 1023;  // smallest reading seen so far\nint highest = 0;    // largest reading seen so far\n\nvoid setup() {\n  Serial.begin(9600);\n}\n\nvoid loop() {\n  int level = analogRead(LDR);   // a number from 0 to 1023\n\n  if (level < lowest) lowest = level;\n  if (level > highest) highest = level;\n\n  // \"name:value\" pairs show up as labelled lines in the Serial Plotter\n  Serial.print(\"light:\");\n  Serial.print(level);\n  Serial.print(\" lowest:\");\n  Serial.print(lowest);\n  Serial.print(\" highest:\");\n  Serial.println(highest);\n\n  delay(100);\n}\n"}, {"id": "joystick-explorer", "file": "joystick_explorer.ino", "no": 4, "title": "Joystick explorer", "level": 1, "minutes": 10, "parts": ["joystick"], "library": null, "description": "The Serial Plotter shows three lines: the X position, the Y position and the joystick switch. You use this project to find the directions of your joystick.", "learn": ["A joystick has two potentiometers and a switch", "`INPUT_PULLUP` for switches", "How to find the directions"], "wiring": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the joystick:", "rows": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Open the Serial Plotter (⟦Tools › Serial Plotter⟧) and set the speed to 9600 baud."}, {"t": "Release the joystick. Make sure that the x and y values are approximately 512."}, {"t": "Hold the joystick in the position that you will use for games."}, {"t": "Push the joystick fully to the right. Make sure that the x value increases to 1023."}, {"t": "Push the joystick fully up. Make sure that the y value increases to 1023."}, {"t": "If a value decreases, record which value it is.", "note": "Other sketches have `INVERT_X` and `INVERT_Y` settings. Set the applicable setting to `true` to correct the direction."}, {"t": "Push the joystick down into the module. Make sure that the click line goes up and the L LED comes on."}]}], "faults": [{"fault": "The y line moves when you push the joystick to the left or right.", "actions": ["Turn the joystick 90° in your hand.", "Or, interchange the jumper cables on VRx and VRy."]}, {"fault": "The click line does not move.", "actions": ["Make sure that the SW pin connects to D2.", "Make sure that the GND pin connects to the GND rail."]}], "changes": ["Make the L LED come on only when you push the joystick fully to the left.", "Show UP, DOWN, LEFT or RIGHT in the Serial Monitor in place of the values."], "code": "// Joystick explorer\n// The Serial Plotter shows three lines: the X position, the Y position and\n// the joystick switch. You use this project to find the directions of your\n// joystick.\n// Connections:\n//   Joystick VRx  ->  A0\n//   Joystick VRy  ->  A1\n//   Joystick SW   ->  D2\n//   Joystick +5V  ->  5V rail\n//   Joystick GND  ->  GND rail\n\nconst int JOY_X = A0;\nconst int JOY_Y = A1;\nconst int JOY_SW = 2;\nconst int LED = 13;\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(JOY_SW, INPUT_PULLUP);  // the click switch pulls the pin LOW when pressed\n  pinMode(LED, OUTPUT);\n}\n\nvoid loop() {\n  int x = analogRead(JOY_X);      // about 512 when the stick is centred\n  int y = analogRead(JOY_Y);\n  bool clicked = digitalRead(JOY_SW) == LOW;\n\n  digitalWrite(LED, clicked ? HIGH : LOW);\n\n  Serial.print(\"x:\");\n  Serial.print(x);\n  Serial.print(\" y:\");\n  Serial.print(y);\n  Serial.print(\" click:\");\n  Serial.println(clicked ? 1023 : 0);  // drawn full height so it is easy to spot\n\n  delay(50);\n}\n"}, {"id": "buzzer-check", "file": "buzzer_check.ino", "no": 5, "title": "Buzzer check", "level": 1, "minutes": 5, "parts": ["buzzer"], "library": null, "description": "This sketch finds the type of buzzer in your kit. An active buzzer makes one fixed sound. A passive buzzer can make each musical note.", "learn": ["Active and passive buzzers", "`tone()` and `noTone()`"], "wiring": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "If there is a paper label on the top of the buzzer, remove it.", "note": "The paper label decreases the sound."}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Open the Serial Monitor (⟦Tools › Serial Monitor⟧) and set the speed to 9600 baud."}, {"t": "Listen to test 1. The buzzer pin is `HIGH` for 1 second."}, {"t": "Listen to test 2. The buzzer plays three notes."}, {"t": "Read the result in the Serial Monitor.", "note": "A sound in test 1 means that the buzzer is active. No sound in test 1 and clear notes in test 2 mean that the buzzer is passive."}, {"t": "Push the ⟦RESET⟧ button on the UNO board to do the test again."}]}], "faults": [{"fault": "The buzzer makes a sound all the time.", "actions": ["No action is necessary. Some buzzers operate when the signal is `LOW`. The sound and the silence change places in the other sketches."]}, {"fault": "The buzzer makes no sound.", "actions": ["Make sure that the S pin connects to D8.", "Make sure that the + pin and the − pin connect to the rails."]}], "changes": ["Make a doorbell sound: one high note, then one low note.", "Change `delay(5)` to `delay(2)` in `playSiren()`. The siren becomes faster."], "code": "// Buzzer check\n// This sketch finds the type of buzzer in your kit. An active buzzer makes\n// one fixed sound. A passive buzzer can make each musical note.\n// Connections:\n//   Buzzer S  ->  D8\n//   Buzzer +  ->  5V rail\n//   Buzzer -  ->  GND rail\n\nconst int BUZZER = 8;\n\nvoid playSiren(int times) {\n  for (int i = 0; i < times; i++) {\n    for (int f = 600; f <= 1200; f += 10) { tone(BUZZER, f); delay(5); }\n    for (int f = 1200; f >= 600; f -= 10) { tone(BUZZER, f); delay(5); }\n  }\n  noTone(BUZZER);\n}\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(BUZZER, OUTPUT);\n\n  Serial.println(\"Test 1: switching the buzzer pin on for 1 second...\");\n  digitalWrite(BUZZER, HIGH);\n  delay(1000);\n  digitalWrite(BUZZER, LOW);\n  delay(800);\n\n  Serial.println(\"Test 2: playing C, E, G with tone()...\");\n  tone(BUZZER, 523, 300); delay(400);\n  tone(BUZZER, 659, 300); delay(400);\n  tone(BUZZER, 784, 300); delay(700);\n\n  Serial.println();\n  Serial.println(\"Beeped in test 1?  You have an ACTIVE buzzer (one fixed pitch).\");\n  Serial.println(\"Silent in test 1, clean notes in test 2?  You have a PASSIVE buzzer (plays any note).\");\n  Serial.println();\n  Serial.println(\"Now a siren. Press the board's reset button to run the tests again.\");\n  delay(500);\n  playSiren(3);\n}\n\nvoid loop() {\n  // Nothing here: the tests run once in setup()\n}\n"}, {"id": "servo-sweep", "file": "servo_sweep.ino", "no": 6, "title": "Servo sweep", "level": 1, "minutes": 10, "parts": ["servo"], "library": null, "description": "The servo arm turns from 0° to 180° and back. A servo turns to the angle that the sketch gives it and stays there.", "learn": ["The Servo library", "for loops"], "wiring": [["servo", "Servo", "orange wire", "D9"], ["servo", "Servo", "red wire", "5V"], ["servo", "Servo", "brown wire", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Push a plastic horn on the servo shaft."}, {"t": "Connect the servo with three jumper cables:", "note": "On some servos, the GND wire is black and the signal wire is yellow.", "rows": [["servo", "Servo", "orange wire", "D9"], ["servo", "Servo", "red wire", "5V"], ["servo", "Servo", "brown wire", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that the servo arm turns slowly to one end, stops, and turns back.", "caution": "Do not turn the servo arm with your hand while the power is on. This can cause damage to the plastic gears."}]}], "faults": [{"fault": "The UNO board resets or the USB connection stops when the servo moves.", "actions": ["Connect the USB cable to a different USB socket.", "If possible, use a USB hub that has a separate power supply."]}, {"fault": "The servo makes a noise at the two ends.", "actions": ["Change the two limits in the sketch from 0 and 180 to 10 and 170."]}], "changes": ["Change `delay(15)` to make the servo move faster or slower.", "Make the servo arm move between 60° and 120° only."], "code": "// Servo sweep\n// The servo arm turns from 0° to 180° and back. A servo turns to the angle\n// that the sketch gives it and stays there.\n// Connections:\n//   Servo orange wire  ->  D9\n//   Servo red wire     ->  5V rail\n//   Servo brown wire   ->  GND rail\n\n#include <Servo.h>\n\nconst int SERVO_PIN = 9;\nServo arm;\n\nvoid setup() {\n  arm.attach(SERVO_PIN);\n}\n\nvoid loop() {\n  for (int angle = 0; angle <= 180; angle++) {\n    arm.write(angle);   // move to this angle (0 to 180 degrees)\n    delay(15);          // give it time to get there\n  }\n  delay(500);\n\n  for (int angle = 180; angle >= 0; angle--) {\n    arm.write(angle);\n    delay(15);\n  }\n  delay(500);\n}\n"}, {"id": "line-sensor-test", "file": "line_sensor_test.ino", "no": 7, "title": "Line sensor test", "level": 1, "minutes": 5, "parts": ["line"], "library": null, "description": "The line tracer finds the difference between a light surface and a dark surface below it. It gives a `HIGH` or `LOW` signal.", "learn": ["Infrared reflection sensors", "`digitalRead()`"], "wiring": [["line", "Line tracer", "OUT", "D7"], ["line", "Line tracer", "VCC", "5V"], ["line", "Line tracer", "GND", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the line tracer:", "note": "On some line tracers, the OUT pin has the label S.", "rows": [["line", "Line tracer", "OUT", "D7"], ["line", "Line tracer", "VCC", "5V"], ["line", "Line tracer", "GND", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Open the Serial Monitor (⟦Tools › Serial Monitor⟧) and set the speed to 9600 baud."}, {"t": "Hold white paper approximately 5 mm below the line tracer."}, {"t": "Record the value in the Serial Monitor (`HIGH` or `LOW`)."}, {"t": "Hold black tape approximately 5 mm below the line tracer."}, {"t": "Record the value again.", "note": "The value for the white paper is your `SEES_SOMETHING` value. The object counter uses it."}, {"t": "If the line tracer has a blue trimpot, turn it slowly to change the distance that it can sense.", "caution": "Use a small screwdriver and apply only a small force. The trimpot breaks easily."}]}], "faults": [{"fault": "The value does not change.", "actions": ["Move the paper nearer to the line tracer. The maximum range is approximately 20 mm.", "Move away from sunlight. Sunlight has much infrared light and the line tracer cannot sense the paper."]}], "changes": ["Count the number of times that the value changes.", "Make the buzzer on D8 operate when the line tracer senses black tape."], "code": "// Line sensor test\n// The line tracer finds the difference between a light surface and a dark\n// surface below it. It gives a HIGH or LOW signal.\n// Connections:\n//   Line tracer OUT  ->  D7\n//   Line tracer VCC  ->  5V rail\n//   Line tracer GND  ->  GND rail\n\nconst int LINE = 7;\nconst int LED = 13;\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(LINE, INPUT);\n  pinMode(LED, OUTPUT);\n}\n\nvoid loop() {\n  int state = digitalRead(LINE);\n  digitalWrite(LED, state);\n  Serial.println(state == HIGH ? \"HIGH\" : \"LOW\");\n  delay(200);\n}\n"}, {"id": "matrix-hello", "file": "matrix_hello.ino", "no": 8, "title": "Matrix hello", "level": 1, "minutes": 20, "parts": ["matrix"], "library": "LedControl", "description": "The LED matrix shows a letter F, a face, a heart and moving squares. You use the letter F to find the correct orientation for all matrix sketches.", "learn": ["How to install a library", "Pictures as binary numbers", "How to correct a rotated display"], "wiring": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]], "tasks": [{"title": "Install the library", "steps": [{"t": "In the Arduino IDE, open ⟦Sketch › Include Library › Manage Libraries⟧."}, {"t": "Enter LedControl in the search box."}, {"t": "Find LedControl by Eberhard Fahle and click ⟦Install⟧."}]}, {"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Make sure that the LED matrix has five input pins: VCC, GND, DIN, CS and CLK.", "note": "If the LED matrix has only four pins with the labels SDA and SCL, it is a different type. Refer to Parts, LED matrix."}, {"t": "Connect the LED matrix at its DIN end:", "note": "The pins at the other end have the label DOUT. They connect to a second matrix.", "rows": [["matrix", "LED matrix", "DIN", "D12"], ["matrix", "LED matrix", "CLK", "D11"], ["matrix", "LED matrix", "CS", "D10"], ["matrix", "LED matrix", "VCC", "5V"], ["matrix", "LED matrix", "GND", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that a capital letter F shows for 4 seconds."}, {"t": "If the letter F is rotated or reversed, change `SWAP_XY`, `FLIP_X` or `FLIP_Y` to `true`. Change one setting at a time.", "note": "Upload the sketch again after each change."}, {"t": "Record the three settings that show the letter F correctly. All matrix sketches use them."}, {"t": "Make sure that a face, a heart and moving squares show."}]}], "faults": [{"fault": "No LEDs come on.", "actions": ["Make sure that DIN connects to D12.", "Make sure that the jumper cables are on the DIN end, not the DOUT end."]}, {"fault": "Random LEDs come on.", "actions": ["Push the CLK and CS jumper cables fully into their holes."]}, {"fault": "The upload stops with “LedControl.h: No such file or directory”.", "actions": ["Install the LedControl library. Refer to task 1."]}], "changes": ["Make a new picture. Each 1 in a `0b…` line is an LED that comes on.", "Make a picture with the Etch-a-sketch project. Then paste its code here."], "code": "// Matrix hello\n// The LED matrix shows a letter F, a face, a heart and moving squares. You\n// use the letter F to find the correct orientation for all matrix sketches.\n// Library: LedControl (Sketch > Include Library > Manage Libraries)\n// Connections:\n//   LED matrix DIN  ->  D12\n//   LED matrix CLK  ->  D11\n//   LED matrix CS   ->  D10\n//   LED matrix VCC  ->  5V rail\n//   LED matrix GND  ->  GND rail\n\n#include <LedControl.h>\n\n// ---- LED matrix (MAX7219): DIN -> D12, CLK -> D11, CS -> D10 ----\nLedControl matrix(12, 11, 10, 1);   // DIN, CLK, CS, number of matrices\n\n// Do the Matrix hello project first.\n// Then copy its three orientation settings into these lines.\nconst bool SWAP_XY = false;\nconst bool FLIP_X = false;\nconst bool FLIP_Y = false;\n\nbyte frame[8];   // the picture: frame[y], bit 7 is the left column (x = 0)\n\nvoid clearFrame() {\n  for (byte y = 0; y < 8; y++) frame[y] = 0;\n}\n\nvoid setPixel(int x, int y, bool on) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return;\n  if (on) frame[y] |= (0x80 >> x);\n  else frame[y] &= ~(0x80 >> x);\n}\n\nbool getPixel(int x, int y) {\n  if (x < 0 || x > 7 || y < 0 || y > 7) return false;\n  return frame[y] & (0x80 >> x);\n}\n\nvoid showFrame() {\n  for (byte row = 0; row < 8; row++) {\n    byte bits = 0;\n    for (byte col = 0; col < 8; col++) {\n      byte x = col, y = row;\n      if (SWAP_XY) { byte t = x; x = y; y = t; }\n      if (FLIP_X) x = 7 - x;\n      if (FLIP_Y) y = 7 - y;\n      if (getPixel(x, y)) bits |= (0x80 >> col);\n    }\n    matrix.setRow(0, row, bits);\n  }\n}\n\nvoid showImage(const byte image[8]) {\n  for (byte y = 0; y < 8; y++) frame[y] = image[y];\n  showFrame();\n}\n\nvoid matrixBegin() {\n  matrix.shutdown(0, false);   // wake the driver chip up\n  matrix.setIntensity(0, 3);   // brightness 0 to 15 (keep it low on USB power)\n  matrix.clearDisplay(0);\n}\n// ---- end of LED matrix section ----\n\nconst byte LETTER_F[8] = {\n  0b01111110,\n  0b01000000,\n  0b01000000,\n  0b01111100,\n  0b01000000,\n  0b01000000,\n  0b01000000,\n  0b00000000\n};\n\nconst byte SMILE[8] = {\n  0b00111100,\n  0b01000010,\n  0b10100101,\n  0b10000001,\n  0b10100101,\n  0b10011001,\n  0b01000010,\n  0b00111100\n};\n\nconst byte HEART[8] = {\n  0b00000000,\n  0b01100110,\n  0b11111111,\n  0b11111111,\n  0b11111111,\n  0b01111110,\n  0b00111100,\n  0b00011000\n};\n\nvoid growingSquares() {\n  for (int size = 0; size < 4; size++) {\n    clearFrame();\n    for (int i = 3 - size; i <= 4 + size; i++) {\n      setPixel(i, 3 - size, true);   // top edge\n      setPixel(i, 4 + size, true);   // bottom edge\n      setPixel(3 - size, i, true);   // left edge\n      setPixel(4 + size, i, true);   // right edge\n    }\n    showFrame();\n    delay(150);\n  }\n}\n\nvoid setup() {\n  matrixBegin();\n  showImage(LETTER_F);   // should read as a normal capital F\n  delay(4000);\n}\n\nvoid loop() {\n  showImage(SMILE);\n  delay(1500);\n  showImage(HEART);\n  delay(1500);\n  for (int i = 0; i < 3; i++) growingSquares();\n}\n"}, {"id": "pedestrian-crossing", "file": "pedestrian_crossing.ino", "no": 9, "title": "Pedestrian crossing", "level": 2, "minutes": 30, "parts": ["leds", "rgb", "buttons", "buzzer"], "library": null, "description": "A traffic light stops for pedestrians. The buzzer makes the slow locator sound and the fast walk sound of an Australian pedestrian crossing.", "learn": ["How to read a pushbutton with `INPUT_PULLUP`", "Timing with `millis()`", "A sequence of states"], "wiring": [["leds", "Red LED", "long leg, through 220 Ω", "D13"], ["leds", "Yellow LED", "long leg, through 220 Ω", "A4"], ["leds", "Green LED", "long leg, through 220 Ω", "A5"], ["leds", "All LEDs", "short legs", "GND"], ["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"], ["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"], ["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "If the Traffic light parts are still on the breadboard, keep them. Go to the RGB LED step.", "note": "The RGB LED is the walk signal: red means stop, green means walk."}, {"t": "Put the red, yellow and green LEDs in the breadboard. Put each LED leg in a different row.", "caution": "Put a 220 Ω resistor between each LED and its pin. Without a resistor, too much current can cause damage to the LED and the pin.", "note": "The long leg of an LED is the positive (+) leg."}, {"t": "Connect a 220 Ω resistor from the long leg of each LED to an empty row.", "note": "A 220 Ω resistor has red, red and brown bands."}, {"t": "Connect each resistor row to its pin with a jumper cable:", "rows": [["leds", "Red LED", "long leg, through 220 Ω", "D13"], ["leds", "Yellow LED", "long leg, through 220 Ω", "A4"], ["leds", "Green LED", "long leg, through 220 Ω", "A5"]]}, {"t": "Connect the short leg of each LED to the GND rail.", "rows": [["leds", "All LEDs", "short legs", "GND"]]}, {"t": "Connect the RGB LED:", "rows": [["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]]}, {"t": "Put pushbutton A across the centre gap.", "note": "Diagonally opposite legs of a pushbutton are always the switched pair."}, {"t": "Connect pushbutton A:", "rows": [["buttons", "Button A", "one leg", "D4"], ["buttons", "Button A", "diagonally opposite leg", "GND"]]}, {"t": "Connect the buzzer:", "note": "Some buzzers have their pins in a different sequence. The labels on the buzzer are correct.", "rows": [["buzzer", "Buzzer", "S", "D8"], ["buzzer", "Buzzer", "+", "5V"], ["buzzer", "Buzzer", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Make sure that the green LED comes on and the walk signal is red."}, {"t": "Make sure that the buzzer makes a slow tick. This sound helps pedestrians find the pushbutton."}, {"t": "Push pushbutton A."}, {"t": "Make sure that the traffic light changes to yellow, then to red."}, {"t": "Make sure that the walk signal changes to green and the buzzer ticks quickly."}, {"t": "Make sure that the walk signal flashes red, then the traffic light changes to green."}]}], "faults": [{"fault": "The crossing sequence starts without a push.", "actions": ["Make sure that the two pushbutton connections are on diagonally opposite legs."]}, {"fault": "The walk signal shows incorrect colours.", "actions": ["Refer to the `COMMON_ANODE` setting in the sketch."]}], "changes": ["Increase the walk time for a wider road.", "Make the sketch ignore the pushbutton for 10 seconds after each crossing."], "code": "// Pedestrian crossing\n// A traffic light stops for pedestrians. The buzzer makes the slow locator\n// sound and the fast walk sound of an Australian pedestrian crossing.\n// Connections:\n//   Red LED long leg, through 220 Ω     ->  D13\n//   Yellow LED long leg, through 220 Ω  ->  A4\n//   Green LED long leg, through 220 Ω   ->  A5\n//   All LEDs short legs                 ->  GND rail\n//   RGB LED R                           ->  D5\n//   RGB LED G                           ->  D6\n//   RGB LED B                           ->  D3\n//   RGB LED -                           ->  GND rail\n//   Button A one leg                    ->  D4\n//   Button A diagonally opposite leg    ->  GND rail\n//   Buzzer S                            ->  D8\n//   Buzzer +                            ->  5V rail\n//   Buzzer -                            ->  GND rail\n\nconst int CAR_RED = 13;\nconst int CAR_YELLOW = A4;\nconst int CAR_GREEN = A5;\nconst int BUTTON = 4;\nconst int BUZZER = 8;\n\n// ---- RGB LED module: R -> D5, G -> D6, B -> D3, - -> GND rail ----\nconst int RGB_RED = 5;\nconst int RGB_GREEN = 6;\nconst int RGB_BLUE = 3;\n\n// If the RGB LED shows white when it must be off, it is common anode.\n// Connect its common pin to the 5V rail and set this to true.\nconst bool COMMON_ANODE = false;\n\nvoid setColor(int red, int green, int blue) {   // each 0 (off) to 255 (full)\n  if (COMMON_ANODE) { red = 255 - red; green = 255 - green; blue = 255 - blue; }\n  analogWrite(RGB_RED, red);\n  analogWrite(RGB_GREEN, green);\n  analogWrite(RGB_BLUE, blue);\n}\n\nvoid rgbBegin() {\n  pinMode(RGB_RED, OUTPUT);\n  pinMode(RGB_GREEN, OUTPUT);\n  pinMode(RGB_BLUE, OUTPUT);\n  setColor(0, 0, 0);\n}\n// ---- end of RGB LED section ----\n\nvoid carLights(int red, int yellow, int green) {\n  digitalWrite(CAR_RED, red);\n  digitalWrite(CAR_YELLOW, yellow);\n  digitalWrite(CAR_GREEN, green);\n}\n\nvoid walkLight(bool walk) {          // green figure or red figure\n  if (walk) setColor(0, 255, 0);\n  else setColor(255, 0, 0);\n}\n\nvoid crossingCycle() {\n  tone(BUZZER, 1500, 40);           // \"request received\" chirp\n  delay(1500);\n\n  carLights(LOW, HIGH, LOW);         // cars: yellow\n  delay(2500);\n  carLights(HIGH, LOW, LOW);         // cars: red\n  delay(1000);\n\n  walkLight(true);                   // walk: rapid ticking\n  unsigned long start = millis();\n  while (millis() - start < 6000) {\n    tone(BUZZER, 1000, 30);\n    delay(110);\n  }\n\n  for (int i = 0; i < 6; i++) {      // flashing red: finish crossing\n    walkLight(false);\n    tone(BUZZER, 800, 30);\n    delay(400);\n    setColor(0, 0, 0);\n    delay(400);\n  }\n  walkLight(false);\n  delay(1000);\n\n  carLights(LOW, LOW, HIGH);         // cars: green again\n  delay(3000);                       // cars get at least 3 seconds\n}\n\nvoid setup() {\n  pinMode(CAR_RED, OUTPUT);\n  pinMode(CAR_YELLOW, OUTPUT);\n  pinMode(CAR_GREEN, OUTPUT);\n  pinMode(BUTTON, INPUT_PULLUP);     // pressed = LOW\n  rgbBegin();\n  carLights(LOW, LOW, HIGH);\n  walkLight(false);\n}\n\nunsigned long lastTick = 0;\n\nvoid loop() {\n  if (digitalRead(BUTTON) == LOW) {\n    crossingCycle();\n    lastTick = millis();\n  }\n\n  // Slow \"locator\" tick so people can find the button\n  if (millis() - lastTick >= 1500) {\n    tone(BUZZER, 900, 15);\n    lastTick = millis();\n  }\n}\n"}, {"id": "night-light", "file": "night_light.ino", "no": 10, "title": "Automatic night light", "level": 2, "minutes": 15, "parts": ["ldr", "rgb"], "library": null, "description": "The RGB LED comes on with a warm light when the room light decreases. Less light in the room gives more light from the LED.", "learn": ["`map()` and `constrain()`", "How to smooth an unstable value", "Brightness control with `analogWrite()`"], "wiring": [["ldr", "Light sensor", "S", "A2"], ["ldr", "Light sensor", "+", "5V"], ["ldr", "Light sensor", "−", "GND"], ["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Do the Light meter project first. Record your `ROOM_LIT` and `ROOM_DARK` values."}, {"t": "Connect the light sensor:", "rows": [["ldr", "Light sensor", "S", "A2"], ["ldr", "Light sensor", "+", "5V"], ["ldr", "Light sensor", "−", "GND"]]}, {"t": "Connect the RGB LED:", "rows": [["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "Change `ROOM_LIT` and `ROOM_DARK` to the values that you recorded in Light meter."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "With the room light on, make sure that the RGB LED stays off."}, {"t": "Slowly move your hand above the light sensor."}, {"t": "Make sure that the RGB LED slowly comes on and becomes brighter."}, {"t": "Remove your hand. Make sure that the RGB LED goes off."}]}], "faults": [{"fault": "The RGB LED stays on or stays off.", "actions": ["Do the Light meter project again.", "Change `ROOM_LIT` and `ROOM_DARK` to the new values."]}, {"fault": "The RGB LED comes on and goes off again and again.", "actions": ["Turn the RGB LED away from the light sensor. Its light goes into the light sensor."]}], "changes": ["Change the colour: `setColor(0, 0, darkness)` gives a blue light.", "Make the RGB LED slowly change colour when there is no light in the room."], "code": "// Automatic night light\n// The RGB LED comes on with a warm light when the room light decreases. Less\n// light in the room gives more light from the LED.\n// Connections:\n//   Light sensor S  ->  A2\n//   Light sensor +  ->  5V rail\n//   Light sensor -  ->  GND rail\n//   RGB LED R       ->  D5\n//   RGB LED G       ->  D6\n//   RGB LED B       ->  D3\n//   RGB LED -       ->  GND rail\n\nconst int LDR = A2;\n\n// Get these two values from the Light meter project:\nconst int ROOM_LIT = 700;    // value with the room light on\nconst int ROOM_DARK = 200;   // value with your hand above the light sensor\n\n// ---- RGB LED module: R -> D5, G -> D6, B -> D3, - -> GND rail ----\nconst int RGB_RED = 5;\nconst int RGB_GREEN = 6;\nconst int RGB_BLUE = 3;\n\n// If the RGB LED shows white when it must be off, it is common anode.\n// Connect its common pin to the 5V rail and set this to true.\nconst bool COMMON_ANODE = false;\n\nvoid setColor(int red, int green, int blue) {   // each 0 (off) to 255 (full)\n  if (COMMON_ANODE) { red = 255 - red; green = 255 - green; blue = 255 - blue; }\n  analogWrite(RGB_RED, red);\n  analogWrite(RGB_GREEN, green);\n  analogWrite(RGB_BLUE, blue);\n}\n\nvoid rgbBegin() {\n  pinMode(RGB_RED, OUTPUT);\n  pinMode(RGB_GREEN, OUTPUT);\n  pinMode(RGB_BLUE, OUTPUT);\n  setColor(0, 0, 0);\n}\n// ---- end of RGB LED section ----\n\nint smoothed;   // a steadied version of the sensor reading\n\nvoid setup() {\n  Serial.begin(9600);\n  rgbBegin();\n  smoothed = analogRead(LDR);\n}\n\nvoid loop() {\n  // Blend each new reading into the old one so the light doesn't flicker\n  smoothed = (smoothed * 7 + analogRead(LDR)) / 8;\n\n  // 0 = fully lit room, 255 = fully dark room\n  long darkness = map(smoothed, ROOM_LIT, ROOM_DARK, 0, 255);\n  darkness = constrain(darkness, 0, 255);\n  if (darkness < 40) darkness = 0;   // stay off while the room is bright\n\n  // Warm white: full red, a bit less green, a little blue\n  setColor(darkness, darkness * 6 / 10, darkness / 6);\n\n  Serial.print(\"light:\");\n  Serial.print(smoothed);\n  Serial.print(\" glow:\");\n  Serial.println(darkness);\n  delay(50);\n}\n"}, {"id": "colour-mixer", "file": "colour_mixer.ino", "no": 11, "title": "Colour mixer", "level": 2, "minutes": 15, "parts": ["joystick", "rgb"], "library": null, "description": "The joystick position sets the colour of the RGB LED. The Serial Monitor shows the red, green and blue values that make each colour.", "learn": ["How red, green and blue make colours", "`atan2()` to change a position into an angle", "A switch that changes a state"], "wiring": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"], ["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the joystick:", "rows": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"]]}, {"t": "Connect the RGB LED:", "rows": [["rgb", "RGB LED", "R", "D5"], ["rgb", "RGB LED", "G", "D6"], ["rgb", "RGB LED", "B", "D3"], ["rgb", "RGB LED", "−", "GND"]]}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "If you changed `INVERT_X` or `INVERT_Y` in other sketches, make the same changes here."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Open the Serial Monitor (⟦Tools › Serial Monitor⟧) and set the speed to 9600 baud."}, {"t": "Move the joystick slowly in a full circle."}, {"t": "Make sure that the colour changes from red to yellow, green, cyan, blue and magenta."}, {"t": "Push the joystick farther from the centre. Make sure that the colour becomes brighter."}, {"t": "Push the joystick down into the module. The colour stays the same."}, {"t": "Read the three colour values in the Serial Monitor."}, {"t": "Push the joystick down again to release the colour."}]}], "faults": [{"fault": "The colours go around the circle in the opposite direction.", "actions": ["Set `INVERT_X` or `INVERT_Y` to `true`."]}, {"fault": "One colour does not come on.", "actions": ["Make sure that the R, G and B pins connect to D5, D6 and D3."]}], "changes": ["Find the values for orange, pink and purple. Record them.", "Make each push of the joystick switch show the subsequent colour from a list."], "code": "// Colour mixer\n// The joystick position sets the colour of the RGB LED. The Serial Monitor\n// shows the red, green and blue values that make each colour.\n// Connections:\n//   Joystick VRx  ->  A0\n//   Joystick VRy  ->  A1\n//   Joystick SW   ->  D2\n//   Joystick +5V  ->  5V rail\n//   Joystick GND  ->  GND rail\n//   RGB LED R     ->  D5\n//   RGB LED G     ->  D6\n//   RGB LED B     ->  D3\n//   RGB LED -     ->  GND rail\n\n// ---- Joystick: VRx -> A0, VRy -> A1, SW -> D2 ----\nconst int JOY_X = A0;\nconst int JOY_Y = A1;\nconst int JOY_SW = 2;\n\n// If a direction is reversed, change false to true.\nconst bool INVERT_X = false;\nconst bool INVERT_Y = false;\n\nconst byte NONE = 0, UP = 1, DOWN = 2, LEFT = 3, RIGHT = 4;\n\nint joyX() {           // 0 = full left, 1023 = full right\n  int v = analogRead(JOY_X);\n  return INVERT_X ? 1023 - v : v;\n}\n\nint joyY() {           // 0 = full down, 1023 = full up\n  int v = analogRead(JOY_Y);\n  return INVERT_Y ? 1023 - v : v;\n}\n\nbyte joyDirection() {  // which way the stick is pushed, or NONE\n  int dx = joyX() - 512;\n  int dy = joyY() - 512;\n  if (abs(dx) < 300 && abs(dy) < 300) return NONE;\n  if (abs(dx) > abs(dy)) return dx > 0 ? RIGHT : LEFT;\n  return dy > 0 ? UP : DOWN;\n}\n\nbool joyClicked() {    // true while the stick is pressed in\n  return digitalRead(JOY_SW) == LOW;\n}\n// ---- end of joystick section ----\n\n// ---- RGB LED module: R -> D5, G -> D6, B -> D3, - -> GND rail ----\nconst int RGB_RED = 5;\nconst int RGB_GREEN = 6;\nconst int RGB_BLUE = 3;\n\n// If the RGB LED shows white when it must be off, it is common anode.\n// Connect its common pin to the 5V rail and set this to true.\nconst bool COMMON_ANODE = false;\n\nvoid setColor(int red, int green, int blue) {   // each 0 (off) to 255 (full)\n  if (COMMON_ANODE) { red = 255 - red; green = 255 - green; blue = 255 - blue; }\n  analogWrite(RGB_RED, red);\n  analogWrite(RGB_GREEN, green);\n  analogWrite(RGB_BLUE, blue);\n}\n\nvoid rgbBegin() {\n  pinMode(RGB_RED, OUTPUT);\n  pinMode(RGB_GREEN, OUTPUT);\n  pinMode(RGB_BLUE, OUTPUT);\n  setColor(0, 0, 0);\n}\n// ---- end of RGB LED section ----\n\nint shownRed = 0, shownGreen = 0, shownBlue = 0;\n\n// hue: position around the colour wheel, 0 to 359 degrees\n// level: brightness, 0 to 255\nvoid showHue(int hue, int level) {\n  int segment = hue / 60;                  // which sixth of the wheel\n  int rise = (long)(hue % 60) * level / 60;\n  int fall = level - rise;\n  int r, g, b;\n  switch (segment) {\n    case 0:  r = level; g = rise;  b = 0;     break;  // red to yellow\n    case 1:  r = fall;  g = level; b = 0;     break;  // yellow to green\n    case 2:  r = 0;     g = level; b = rise;  break;  // green to cyan\n    case 3:  r = 0;     g = fall;  b = level; break;  // cyan to blue\n    case 4:  r = rise;  g = 0;     b = level; break;  // blue to magenta\n    default: r = level; g = 0;     b = fall;  break;  // magenta to red\n  }\n  shownRed = r; shownGreen = g; shownBlue = b;\n  setColor(r, g, b);\n}\n\nbool locked = false;\nbool wasClicked = false;\nunsigned long lastPrint = 0;\n\nvoid setup() {\n  Serial.begin(9600);\n  pinMode(JOY_SW, INPUT_PULLUP);\n  rgbBegin();\n}\n\nvoid loop() {\n  bool clicked = joyClicked();\n  if (clicked && !wasClicked) {            // just pressed\n    locked = !locked;\n    Serial.println(locked ? \"Locked\" : \"Unlocked\");\n    delay(30);                             // ignore switch bounce\n  }\n  wasClicked = clicked;\n\n  if (!locked) {\n    float dx = joyX() - 512;\n    float dy = joyY() - 512;\n    float distance = sqrt(dx * dx + dy * dy);\n    if (distance < 60) {\n      setColor(0, 0, 0);                   // stick centred: off\n      shownRed = shownGreen = shownBlue = 0;\n    } else {\n      int hue = (int)(atan2(dy, dx) * 180.0 / PI);\n      if (hue < 0) hue += 360;\n      int level = constrain(map((long)distance, 60, 500, 30, 255), 30, 255);\n      showHue(hue, level);\n    }\n  }\n\n  if (millis() - lastPrint > 300) {\n    lastPrint = millis();\n    Serial.print(\"red \");\n    Serial.print(shownRed);\n    Serial.print(\"  green \");\n    Serial.print(shownGreen);\n    Serial.print(\"  blue \");\n    Serial.println(shownBlue);\n  }\n  delay(10);\n}\n"}, {"id": "joystick-pointer", "file": "joystick_pointer.ino", "no": 12, "title": "Joystick pointer", "level": 2, "minutes": 15, "parts": ["joystick", "servo"], "library": null, "description": "The joystick moves the servo arm. A bigger push gives a faster movement. When you release the joystick, the servo arm stays at its position.", "learn": ["Speed control and position control", "Decimal numbers for smooth movement"], "wiring": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"], ["servo", "Servo", "orange wire", "D9"], ["servo", "Servo", "red wire", "5V"], ["servo", "Servo", "brown wire", "GND"]], "tasks": [{"title": "Connect the parts", "steps": [{"t": "Disconnect the USB cable from the UNO board.", "caution": "Disconnect the USB cable before you change the wiring. A wiring error while the power is on can cause damage to the UNO board."}, {"t": "Connect the 5V pin of the UNO board to the 5V rail with a red jumper cable."}, {"t": "Connect a GND pin of the UNO board to the GND rail with a black jumper cable."}, {"t": "Connect the joystick:", "rows": [["joystick", "Joystick", "VRx", "A0"], ["joystick", "Joystick", "VRy", "A1"], ["joystick", "Joystick", "SW", "D2"], ["joystick", "Joystick", "+5V", "5V"], ["joystick", "Joystick", "GND", "GND"]]}, {"t": "Push a plastic horn on the servo shaft."}, {"t": "Connect the servo with three jumper cables:", "note": "On some servos, the GND wire is black and the signal wire is yellow.", "rows": [["servo", "Servo", "orange wire", "D9"], ["servo", "Servo", "red wire", "5V"], ["servo", "Servo", "brown wire", "GND"]]}, {"t": "Attach a paper arrow to the servo horn with tape."}, {"t": "Make sure that each jumper cable is fully in its hole."}]}, {"title": "Upload the sketch", "steps": [{"t": "Connect the UNO board to the computer with the USB cable."}, {"t": "In the Arduino IDE, open a new sketch (⟦File › New Sketch⟧)."}, {"t": "Replace all the text in the new sketch with the code on this page."}, {"t": "If you changed `INVERT_X` or `INVERT_Y` in other sketches, make the same changes here."}, {"t": "Click ⟦Upload⟧ (the arrow button).", "note": "The TX and RX LEDs on the UNO board flash during the upload."}, {"t": "Make sure that the Arduino IDE shows “Done uploading”."}]}, {"title": "Do a test", "steps": [{"t": "Push the joystick to the left. Make sure that the servo arm turns."}, {"t": "Push the joystick farther. Make sure that the servo arm turns faster."}, {"t": "Release the joystick. Make sure that the servo arm stops and stays at its position."}, {"t": "Push the joystick down into the module. Make sure that the servo arm goes to the centre."}]}], "faults": [{"fault": "The servo arm turns in the opposite direction.", "actions": ["Set `INVERT_X` to `true`."]}, {"fault": "The servo arm moves when you do not touch the joystick.", "actions": ["Change the dead zone in the sketch from 60 to 100."]}], "changes": ["Use direct control: `arm.write(map(joyX(), 0, 1023, 0, 180))`. Compare the two types of control.", "Use the up and down directions of the joystick to change `T
